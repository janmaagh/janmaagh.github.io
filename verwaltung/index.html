                y += 4;
                doc.text(policyLines, marginLeft, y);
                y += policyLines.length * 4 + 4;
                doc.text(`Aktuelle Kaution: ${prices.deposit}€ (wird nach Checkout zurückerstattet, sofern keine Schäden vorliegen)`, marginLeft, y, { maxWidth: contentWidth });
                y += 10;

                ensureSpace(10);
                doc.setFontSize(7.5);
                doc.text(
                    `Greenhouse Market GbR · Lucia Hets & Jan Chai Maagh · Brandenburger Straße 17 · 16798 Fürstenberg/Havel` +
                    (companyInfo.taxId ? ` · USt-IdNr.: ${companyInfo.taxId}` : '') +
                    (companyInfo.registerNr ? ` · Unternehmensregisternr.: ${companyInfo.registerNr}` : ''),
                    marginLeft, y, { maxWidth: contentWidth }
                );

                return doc;
            };

            // Versucht, das PDF direkt an eine Mail-App zu übergeben (Share-Sheet mit
            // Anhang). Browser können aus Sicherheitsgründen keine mailto-Links mit
            // Dateianhang öffnen — das Web-Share-API ist der einzige Standardweg, ein
            // Attachment automatisch weiterzugeben (funktioniert v. a. auf
            // Smartphones/Tablets und in aktuellem Chrome/Edge auf dem Desktop).
            // Wo das nicht unterstützt wird, laden wir die PDF herunter und öffnen den
            // Mail-Client vorbereitet — der Anhang muss dann einmal per Hand gezogen werden.
            const sendInvoiceWithAttachment = async (invoice, subject) => {
                let doc;
                try {
                    doc = buildInvoicePdf(invoice);
                } catch (e) {
                    console.error('PDF-Erstellung fehlgeschlagen:', e);
                    alert('Die PDF-Erstellung ist fehlgeschlagen: ' + (e && e.message ? e.message : e) + '\n\nMögliche Ursache: Die PDF-Bibliothek (jsPDF) konnte nicht geladen werden — prüfe deine Internetverbindung bzw. ob ein Werbeblocker/Firewall die Datei von unpkg.com blockiert.');
                    return;
                }
                const invNr = invoiceDisplayNumber(invoice);
                const fileName = `Rechnung-${invNr}.pdf`;
                const blob = doc.output('blob');

                let file = null;
                try {
                    file = new File([blob], fileName, { type: 'application/pdf' });
                } catch (e) {
                    file = null;
                }

                const mailSubject = subject || `Rechnung ${invNr} - Greenhouse Market`;

                if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: mailSubject,
                            text: `Anbei die Rechnung ${invNr} für Ihren Aufenthalt im Greenhouse.`,
                        });
                        return;
                    } catch (e) {
                        if (e && e.name === 'AbortError') return; // Nutzer hat abgebrochen
                        console.warn('Teilen mit Anhang fehlgeschlagen, Fallback auf Download:', e);
                    }
                }

                // Datei-Anhang wird nicht unterstützt (z. B. Browser/App ohne Web-Share-Level-2).
                // Wir laden die PDF trotzdem herunter, damit sie in jedem Fall verfügbar ist,
                // und bieten danach zusätzlich einen reinen Text-Share an (funktioniert auf den
                // meisten Smartphones auch ohne Datei-Unterstützung, z. B. für WhatsApp/Signal).
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);

                const mailBody = generateInvoiceMailContent(invoice);

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: mailSubject,
                            text: `${mailBody}\n\n(Die PDF „${fileName}“ wurde separat heruntergeladen — bitte im Chat/der Mail manuell anhängen.)`,
                        });
                        return;
                    } catch (e) {
                        if (e && e.name === 'AbortError') return;
                        console.warn('Text-Teilen fehlgeschlagen, Fallback auf Mail-App:', e);
                    }
                }

                alert(`„${fileName}“ wurde heruntergeladen.\n\nDein Browser/deine App kann Anhänge nicht automatisch übergeben (Sicherheitsbeschränkung). Gleich öffnet sich dein Mail-Programm vorbereitet — bitte ziehe die heruntergeladene Datei per Drag & Drop dort hinein, bevor du sendest.`);

                window.location.href = `mailto:${invoice.guestEmail}?subject=${encodeURIComponent(mailSubject)}&body=${encodeURIComponent(mailBody)}`;
            };

                    wohnung1: { count: 0, total: 0 },
                    wohnung2: { count: 0, total: 0 },
                    both: { count: 0, total: 0 },
                };
                bookings.forEach(b => {
                    if (map[b.wohnung]) {
                        map[b.wohnung].count += 1;
                        map[b.wohnung].total += safeNum(b.total);
                    }
                });
                return map;
            };

            return (
                <div className="container">
                    <div style={{ marginBottom: '30px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                        <div>
                            <h1>Booking System</h1>
                            <p style={{ color: 'var(--licht-70)', marginTop: '8px' }}>Verwalte Angebote, Buchungen & Zahlungen</p>
                        </div>
                        <button className="secondary" onClick={onLogout}>🔒 Abmelden</button>
                    </div>

                    <div className="tabs">
                        <button className={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>Dashboard</button>
                        <button className={`tab-btn ${activeTab === 'inquiries' ? 'active' : ''}`} onClick={() => setActiveTab('inquiries')}>Anfragen</button>
                        <button className={`tab-btn ${activeTab === 'guests' ? 'active' : ''}`} onClick={() => setActiveTab('guests')}>Gäste</button>
                        <button className={`tab-btn ${activeTab === 'offers' ? 'active' : ''}`} onClick={() => setActiveTab('offers')}>Angebote</button>
                        <button className={`tab-btn ${activeTab === 'bookings' ? 'active' : ''}`} onClick={() => setActiveTab('bookings')}>Buchungen</button>
                        <button className={`tab-btn ${activeTab === 'occupancy' ? 'active' : ''}`} onClick={() => setActiveTab('occupancy')}>Belegung</button>
                        <button className={`tab-btn ${activeTab === 'revenue' ? 'active' : ''}`} onClick={() => setActiveTab('revenue')}>Einnahmen</button>
                        <button className={`tab-btn ${activeTab === 'invoices' ? 'active' : ''}`} onClick={() => setActiveTab('invoices')}>Rechnungen</button>
                        <button className={`tab-btn ${activeTab === 'postausgang' ? 'active' : ''}`} onClick={() => setActiveTab('postausgang')}>Postausgang</button>
                        <button className={`tab-btn ${activeTab === 'pricing' ? 'active' : ''}`} onClick={() => setActiveTab('pricing')}>Preise &amp; Bedingungen</button>
                        <button className={`tab-btn ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>Einstellungen</button>
                    </div>

                    <ErrorBoundary resetKey={activeTab} onReset={() => setActiveTab('dashboard')}>

                    {/* DASHBOARD */}
                    {activeTab === 'dashboard' && (
                        <div>
                            <div className="stat-grid">
                                <div className="stat-card">
                                    <div className="stat-number">{totalOffers}</div>
                                    <div className="stat-label">Angebote</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{confirmedBookings}</div>
                                    <div className="stat-label">Buchungen</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{potentialRevenue.toFixed(0)}€</div>
                                    <div className="stat-label">Mögliche Einnahmen</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{confirmedRevenue.toFixed(0)}€</div>
                                    <div className="stat-label">Bestätigte Einnahmen</div>
                                </div>
                            </div>

                            <div className="card">
                                <h3>Letzte Angebote</h3>
                                {offers.length === 0 ? (
                                    <p style={{ color: 'var(--licht-70)' }}>Noch keine Angebote</p>
                                ) : (
                                    offers.slice(-3).reverse().map(o => (
                                        <div key={o.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '12px 0', borderBottom: '1px solid var(--licht-08)' }}>
                                            <div>
                                                <div style={{ fontFamily: 'var(--font-serif)', fontWeight: '600' }}>{o.id}</div>
                                                <div style={{ fontSize: '13px', color: 'var(--licht-70)' }}>{o.guest.name} • {o.checkIn} bis {o.checkOut}</div>
                                            </div>
                                            <div style={{ textAlign: 'right' }}>
                                                <div style={{ fontFamily: 'var(--font-serif)', fontWeight: '600', color: 'var(--accent)' }}>{safeNum(o.total).toFixed(2)}€</div>
                                                <div className={o.status === 'sent' ? 'status-pending' : 'status-paid'} style={{ marginTop: '4px' }}>
                                                    {o.status === 'sent' ? '📧 Versendet' : '✓ Gebucht'}
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            <div className="card">
                                <h3>Ausstehende Zahlungen</h3>
                                {bookings.filter(b => !b.depositPaid || !b.downPaymentPaid || !b.remainingPaid).length === 0 ? (
                                    <p style={{ color: 'var(--licht-70)' }}>Alle Zahlungen sind eingegangen</p>
                                ) : (
                                    bookings.filter(b => !b.depositPaid || !b.downPaymentPaid || !b.remainingPaid).map(b => (
                                        <div key={b.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '12px 0', borderBottom: '1px solid var(--licht-08)' }}>
                                            <div>
                                                <div style={{ fontFamily: 'var(--font-serif)', fontWeight: '600' }}>{b.id}</div>
                                                <div style={{ fontSize: '13px', color: 'var(--prism-gelb)' }}>
                                                    {!b.depositPaid && `Kaution ${b.deposit}€`}
                                                    {!b.depositPaid && !b.downPaymentPaid && ' + '}
                                                    {!b.downPaymentPaid && `Anzahlung ${b.downPayment}€`}
                                                    {b.downPaymentPaid && !b.remainingPaid && `Restzahlung ${safeNum(b.remaining).toFixed(2)}€`}
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {/* ANFRAGEN */}
                    {activeTab === 'inquiries' && (
                        <div>
                            {dataLoadError && (
                                <div className="error-message" style={{ marginBottom: '16px' }}>⚠ {dataLoadError}</div>
                            )}
                            {inquiries.length === 0 && <p style={{ color: 'var(--licht-70)', textAlign: 'center', padding: '40px 0' }}>Noch keine Anfragen</p>}
                            {inquiries.slice().reverse().map(inquiry => (
                                <div key={inquiry.id} className="item-card">
                                    {editingInquiryId === inquiry.id ? (
                                        <div>
                                            <h4 style={{ marginTop: 0, marginBottom: '12px' }}>Gästedaten bearbeiten</h4>
                                            <div className="grid">
                                                <div className="form-group">
                                                    <label>Name</label>
                                                    <input type="text" value={inquiryEditForm.name} onChange={(e) => setInquiryEditForm({ ...inquiryEditForm, name: e.target.value })} />
                                                </div>
                                                <div className="form-group">
                                                    <label>E-Mail</label>
                                                    <input type="email" value={inquiryEditForm.email} onChange={(e) => setInquiryEditForm({ ...inquiryEditForm, email: e.target.value })} />
                                                </div>
                                                <div className="form-group">
                                                    <label>Telefon</label>
                                                    <input type="tel" value={inquiryEditForm.phone} onChange={(e) => setInquiryEditForm({ ...inquiryEditForm, phone: e.target.value })} />
                                                </div>
                                            </div>
                                            <div className="form-group">
                                                <label>Adresse</label>
                                                <div style={{ display: 'grid', gridTemplateColumns: '3fr 1fr', gap: '10px' }}>
                                                    <input type="text" value={inquiryEditForm.street} onChange={(e) => setInquiryEditForm({ ...inquiryEditForm, street: e.target.value })} placeholder="Straße" />
                                                    <input type="text" value={inquiryEditForm.houseNumber} onChange={(e) => setInquiryEditForm({ ...inquiryEditForm, houseNumber: e.target.value })} placeholder="Hausnr." />
                                                </div>
                                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 3fr', gap: '10px', marginTop: '10px' }}>
                                                    <input type="text" value={inquiryEditForm.zip} onChange={(e) => setInquiryEditForm({ ...inquiryEditForm, zip: e.target.value })} placeholder="PLZ" />
                                                    <input type="text" value={inquiryEditForm.city} onChange={(e) => setInquiryEditForm({ ...inquiryEditForm, city: e.target.value })} placeholder="Ort" />
                                                </div>
                                            </div>
                                            <div className="button-group">
                                                <button onClick={saveInquiryEdit}>💾 Speichern</button>
                                                <button className="secondary" onClick={() => setEditingInquiryId(null)}>Abbrechen</button>
                                            </div>
                                        </div>
                                    ) : (
                                    <React.Fragment>
                                    <div className="item-header">
                                        <div>
                                            <div className="item-title">{inquiry.name}</div>
                                            <div className="item-meta">{inquiry.email} • {inquiry.phone || 'kein Telefon'} • {inquiry.created}</div>
                                        </div>
                                        <div style={{ textAlign: 'right' }}>
                                            <div style={{ fontSize: '18px', fontWeight: '600', color: 'var(--accent)', marginBottom: '4px' }}>{safeNum(inquiry.total).toFixed(2)}€</div>
                                            <div className={inquiry.status === 'accepted' ? 'status-paid' : 'status-pending'}>
                                                {inquiry.status === 'new' ? '🆕 Neu' : inquiry.status === 'accepted' ? '✓ Angebot erstellt' : '✕ Abgelehnt'}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="item-meta">{wohnungLabel(inquiry.wohnung)} • {inquiry.persons} Gäste • {inquiry.nights} Nächte • {inquiry.checkIn} bis {inquiry.checkOut}</div>
                                    {inquiry.address && <div className="item-meta">📍 {inquiry.address}</div>}
                                    <div className="item-meta">
                                        {inquiry.policyAcceptedAt
                                            ? `✓ Stornobedingungen akzeptiert am ${new Date(inquiry.policyAcceptedAt).toLocaleString('de-DE')}`
                                            : '⚠ Stornobedingungen nicht bestätigt (ältere Anfrage)'}
                                    </div>
                                    <div className="button-group" style={{ marginTop: '12px' }}>
                                        {inquiry.status === 'new' && (
                                            <React.Fragment>
                                                <button className="success" onClick={() => acceptInquiry(inquiry)}>✓ Bestätigen (Anzahlung {downPaymentPercent}% fällig)</button>
                                                <button className="danger" onClick={() => rejectInquiry(inquiry.id)}>✕ Ablehnen</button>
                                            </React.Fragment>
                                        )}
                                        {inquiry.status === 'accepted' && (() => {
                                            const matchingOffer = offers.find(o => o.sourceInquiryId === inquiry.id);
                                            return matchingOffer ? (
                                                <React.Fragment>
                                                    <button className="secondary" onClick={() => openOfferMailPreview(matchingOffer)}>📧 Angebot: Mail anzeigen</button>
                                                    <button className="secondary" onClick={() => printOffer(matchingOffer)}>🖨️ Angebot: Drucken/PDF</button>
                                                    <button onClick={() => sendOfferWithAttachment(matchingOffer)}>📎 Angebot: PDF senden</button>
                                                    <button className="danger" onClick={() => undoAcceptInquiry(inquiry)}>↩ Rückgängig machen</button>
                                                </React.Fragment>
                                            ) : null;
                                        })()}
                                        <button className="secondary" onClick={() => startEditInquiry(inquiry)}>✏️ Gästedaten bearbeiten</button>
                                        <button className="secondary" onClick={() => { applySourceToInvoice('inquiry:' + inquiry.id); setActiveTab('invoices'); setShowInvoiceForm(true); }}>🧾 Rechnung erstellen</button>
                                        <button className="danger" onClick={() => deleteInquiry(inquiry.id)}>🗑️ Löschen</button>
                                    </div>
                                    </React.Fragment>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}

                    {/* GÄSTE */}
                    {activeTab === 'guests' && (
                        <div>
                            <button style={{ marginBottom: '16px' }} onClick={() => { if (showGuestForm) { setEditingGuestId(null); setGuestForm({ name: '', email: '', phone: '', street: '', houseNumber: '', zip: '', city: '', notes: '' }); } setShowGuestForm(!showGuestForm); }}>
                                {showGuestForm ? '✕ Abbrechen' : '+ Neuer Gast'}
                            </button>

                            {showGuestForm && (
                                <div className="card">
                                    <h3>{editingGuestId ? 'Gast bearbeiten' : 'Gast hinzufügen'}</h3>
                                    <div className="grid">
                                        <div className="form-group">
                                            <label>Name *</label>
                                            <input type="text" value={guestForm.name} onChange={(e) => setGuestForm({ ...guestForm, name: e.target.value })} placeholder="Maria Schmidt" />
                                        </div>
                                        <div className="form-group">
                                            <label>E-Mail *</label>
                                            <input type="email" value={guestForm.email} onChange={(e) => setGuestForm({ ...guestForm, email: e.target.value })} placeholder="info@example.com" />
                                        </div>
                                        <div className="form-group">
                                            <label>Telefon</label>
                                            <input type="tel" value={guestForm.phone} onChange={(e) => setGuestForm({ ...guestForm, phone: e.target.value })} placeholder="+49 123 456789" />
                                        </div>
                                    </div>
                                    <div className="form-group">
                                        <label>Adresse (für Rechnungen)</label>
                                        <div style={{ display: 'grid', gridTemplateColumns: '3fr 1fr', gap: '10px' }}>
                                            <input type="text" value={guestForm.street} onChange={(e) => setGuestForm({ ...guestForm, street: e.target.value })} placeholder="Straße" />
                                            <input type="text" value={guestForm.houseNumber} onChange={(e) => setGuestForm({ ...guestForm, houseNumber: e.target.value })} placeholder="Hausnr." />
                                        </div>
                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 3fr', gap: '10px', marginTop: '10px' }}>
                                            <input type="text" value={guestForm.zip} onChange={(e) => setGuestForm({ ...guestForm, zip: e.target.value })} placeholder="PLZ" />
                                            <input type="text" value={guestForm.city} onChange={(e) => setGuestForm({ ...guestForm, city: e.target.value })} placeholder="Ort" />
                                        </div>
                                    </div>
                                    <div className="form-group">
                                        <label>Notizen</label>
                                        <textarea value={guestForm.notes} onChange={(e) => setGuestForm({ ...guestForm, notes: e.target.value })} placeholder="Besondere Wünsche..." rows={3}></textarea>
                                    </div>
                                    <button onClick={addGuest}>{editingGuestId ? 'Änderungen speichern' : 'Gast speichern'}</button>
                                </div>
                            )}

                            <div>
                                {guests.map(guest => (
                                    <div key={guest.id} className="item-card">
                                        <div className="item-title">{guest.name}</div>
                                        <div className="item-meta">{guest.email}</div>
                                        {guest.phone && <div className="item-meta">{guest.phone}</div>}
                                        {guest.address && <div className="item-meta">📍 {guest.address}</div>}
                                        {guest.notes && <div className="item-meta" style={{ fontStyle: 'italic', marginTop: '8px' }}>Notiz: {guest.notes}</div>}
                                        <div className="button-group" style={{ marginTop: '12px' }}>
                                            <button className="secondary" onClick={() => startEditGuest(guest)}>✏️ Bearbeiten</button>
                                            <button className="danger" onClick={() => deleteGuest(guest.id)}>Löschen</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ANGEBOTE */}
                    {activeTab === 'offers' && (
                        <div>
                            <button style={{ marginBottom: '16px' }} onClick={() => {
                                if (showOfferForm) {
                                    setEditingOfferId(null);
                                    setOfferForm({
                                        guestId: '', guestName: '', guestEmail: '', guestAddress: '', wohnung: 'wohnung1', checkIn: '', checkOut: '', persons: 1,
                                        earlyCheckin: false, lateCheckout: false, finalCleaning: true,
                                        dogFee: false, dogCount: 1, projektSpace: false, projektSpaceCleaning: false, discountPercent: 0,
                                        ignoreOccupancyCheck: false,
                                    });
                                }
                                setShowOfferForm(!showOfferForm);
                            }}>
                                {showOfferForm ? '✕ Abbrechen' : '+ Neues Angebot'}
                            </button>

                            {showOfferForm && (
                                <div className="card">
                                    <h3>{editingOfferId ? 'Angebot bearbeiten' : 'Angebot erstellen'}</h3>
                                    
                                    <div className="form-group">
                                        <label>Gast wählen *</label>
                                        <div style={{ display: 'flex', gap: '10px', alignItems: 'flex-start' }}>
                                            <select value={offerForm.guestId} onChange={(e) => {
                                                const gid = e.target.value;
                                                const g = guests.find(gg => String(gg.id) === gid);
                                                setOfferForm({
                                                    ...offerForm,
                                                    guestId: gid,
                                                    guestName: g ? g.name : offerForm.guestName,
                                                    guestEmail: g ? g.email : offerForm.guestEmail,
                                                    guestAddress: g ? (g.address || '') : offerForm.guestAddress,
                                                });
                                            }} style={{ flex: 1 }}>
                                                <option value="">-- Gast auswählen --</option>
                                                {editingOfferId && offerForm.guestId && !guests.some(g => String(g.id) === String(offerForm.guestId)) && (
                                                    <option value={offerForm.guestId}>
                                                        {(offers.find(o => o.id === editingOfferId) || {}).guest?.name || 'Gast aus Anfrage'} (nicht im Adressbuch)
                                                    </option>
                                                )}
                                                {guests.map(g => (
                                                    <option key={g.id} value={g.id}>{g.name} ({g.email})</option>
                                                ))}
                                            </select>
                                            <button type="button" className="secondary" onClick={() => setShowQuickGuest(!showQuickGuest)} style={{ whiteSpace: 'nowrap' }}>
                                                {showQuickGuest ? '✕ Abbrechen' : '+ Neuer Gast'}
                                            </button>
                                        </div>
                                        {showQuickGuest && (
                                            <div style={{ marginTop: '10px', padding: '12px', border: '1px solid var(--licht-15)', borderRadius: '4px' }}>
                                                <div className="grid">
                                                    <div className="form-group" style={{ margin: 0 }}>
                                                        <label>Name *</label>
                                                        <input type="text" value={quickGuestForm.name} onChange={(e) => setQuickGuestForm({ ...quickGuestForm, name: e.target.value })} placeholder="Maria Schmidt" />
                                                    </div>
                                                    <div className="form-group" style={{ margin: 0 }}>
                                                        <label>E-Mail *</label>
                                                        <input type="email" value={quickGuestForm.email} onChange={(e) => setQuickGuestForm({ ...quickGuestForm, email: e.target.value })} placeholder="info@example.com" />
                                                    </div>
                                                    <div className="form-group" style={{ margin: 0 }}>
                                                        <label>Telefon</label>
                                                        <input type="tel" value={quickGuestForm.phone} onChange={(e) => setQuickGuestForm({ ...quickGuestForm, phone: e.target.value })} placeholder="+49 123 456789" />
                                                    </div>
                                                </div>
                                                <div style={{ fontSize: '11px', color: 'var(--licht-70)', margin: '8px 0' }}>
                                                    Adresse und weitere Details lassen sich später jederzeit im Gäste-Tab ergänzen.
                                                </div>
                                                <button type="button" onClick={addQuickGuestForOffer} disabled={!quickGuestForm.name || !quickGuestForm.email}>Anlegen &amp; auswählen</button>
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid">
                                        <div className="form-group">
                                            <label>Name des Gastes (für dieses Angebot anpassbar)</label>
                                            <input type="text" value={offerForm.guestName} onChange={(e) => setOfferForm({ ...offerForm, guestName: e.target.value })} />
                                        </div>
                                        <div className="form-group">
                                            <label>E-Mail (für dieses Angebot anpassbar)</label>
                                            <input type="email" value={offerForm.guestEmail} onChange={(e) => setOfferForm({ ...offerForm, guestEmail: e.target.value })} />
                                        </div>
                                        <div className="form-group" style={{ gridColumn: '1/-1' }}>
                                            <label>Adresse des Gastes (für dieses Angebot anpassbar)</label>
                                            <textarea rows={2} value={offerForm.guestAddress} onChange={(e) => setOfferForm({ ...offerForm, guestAddress: e.target.value })} placeholder={"Straße Nr.\nPLZ Ort"}></textarea>
                                        </div>
                                    </div>

                                    <div className="grid">
                                        <div className="form-group">
                                            <label>Wohnung *</label>
                                            <select value={offerForm.wohnung} onChange={(e) => setOfferForm({ ...offerForm, wohnung: e.target.value })}>
                                                <option value="wohnung1">Wohnung I ({prices.wohnung1}€/Nacht)</option>
                                                <option value="wohnung2">Wohnung II ({prices.wohnung2}€/Nacht)</option>
                                                <option value="both">Beide Wohnungen ({prices.both}€/Nacht)</option>
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label>Anzahl Gäste</label>
                                            <input type="number" min="1" max="20" value={offerForm.persons} onChange={(e) => { const v = parseInt(e.target.value); setOfferForm({ ...offerForm, persons: isNaN(v) ? '' : v }); }} onBlur={() => { if (!offerForm.persons) setOfferForm({ ...offerForm, persons: 1 }); }} />
                                            <div style={{ fontSize: '12px', color: 'var(--licht-70)', marginTop: '4px' }}>
                                                Basispreis: bis {getBasePersons(offerForm.wohnung)} Personen (individuelle Zusatzpreise ab Person {getBasePersons(offerForm.wohnung) + 1})
                                            </div>
                                        </div>
                                        <div className="form-group">
                                            <label>Check-in *</label>
                                            <input type="date" value={offerForm.checkIn} onChange={(e) => setOfferForm({ ...offerForm, checkIn: e.target.value })} />
                                        </div>
                                        <div className="form-group">
                                            <label>Check-out *</label>
                                            <input type="date" value={offerForm.checkOut} onChange={(e) => setOfferForm({ ...offerForm, checkOut: e.target.value })} />
                                        </div>
                                    </div>

                                    <div style={{ fontSize: '12px', margin: '4px 0 12px', color: airbnbSyncStatus === 'ok' ? '#6b9080' : airbnbSyncStatus === 'error' ? '#c86464' : 'var(--licht-70)' }}>
                                        {airbnbSyncStatus === 'loading' && '⏳ Airbnb-Belegung wird geladen…'}
                                        {airbnbSyncStatus === 'ok' && '✓ Airbnb-Belegung live synchronisiert'}
                                        {airbnbSyncStatus === 'error' && '⚠ Airbnb-Belegung konnte nicht geladen werden – nur manuelle Buchungen werden geprüft'}
                                    </div>

                                    {offerForm.checkIn && offerForm.checkOut && hasBookedDateInRange(offerForm.checkIn, offerForm.checkOut, offerForm.wohnung, editingOfferId) && (
                                        <div className="error-message" style={{ marginBottom: '12px' }}>
                                            ✗ Dieser Zeitraum ist für {offerForm.wohnung === 'wohnung1' ? 'Wohnung I' : offerForm.wohnung === 'wohnung2' ? 'Wohnung II' : 'beide Wohnungen'} bereits belegt (manuelle Buchung oder Airbnb). {offerForm.ignoreOccupancyCheck ? 'Wird wegen aktivierter Überschreibung trotzdem erstellt.' : 'Bitte anderen Zeitraum wählen, oder weiter unten die Belegungsprüfung ignorieren.'}
                                        </div>
                                    )}

                                    <h4 style={{ marginTop: '20px', marginBottom: '12px' }}>Zusatzgebühren:</h4>
                                    
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="earlyCheckin" checked={offerForm.earlyCheckin} onChange={(e) => setOfferForm({ ...offerForm, earlyCheckin: e.target.checked })} />
                                        <label htmlFor="earlyCheckin" style={{ margin: 0 }}>Early Check-in (+{prices.earlyCheckin}€)</label>
                                    </div>

                                    <div className="checkbox-group">
                                        <input type="checkbox" id="lateCheckout" checked={offerForm.lateCheckout} onChange={(e) => setOfferForm({ ...offerForm, lateCheckout: e.target.checked })} />
                                        <label htmlFor="lateCheckout" style={{ margin: 0 }}>Late Checkout (+{prices.lateCheckout}€)</label>
                                    </div>

                                    <div className="checkbox-group">
                                        <input type="checkbox" id="finalCleaning" checked={true} disabled={true} /><input type="hidden" value="true" onChange={() => setOfferForm({ ...offerForm, finalCleaning: true })} />
                                        <label htmlFor="finalCleaning" style={{ margin: 0, opacity: 0.8 }}>Final Cleaning (+{getFinalCleaning(offerForm.wohnung)}€) <em>mandatory</em></label>
                                    </div>

                                    <div className="checkbox-group">
                                        <input type="checkbox" id="dogFee" checked={offerForm.dogFee} onChange={(e) => setOfferForm({ ...offerForm, dogFee: e.target.checked })} />
                                        <label htmlFor="dogFee" style={{ margin: 0 }}>Hundegebühr ({prices.dogFee}€/Hund/Nacht)</label>
                                    </div>

                                    {offerForm.dogFee && (
                                        <div className="form-group" style={{ marginLeft: '24px' }}>
                                            <label>Anzahl Hunde:</label>
                                            <input type="number" min="1" max="5" value={offerForm.dogCount} onChange={(e) => setOfferForm({ ...offerForm, dogCount: parseInt(e.target.value) })} />
                                        </div>
                                    )}

                                    <div className="checkbox-group">
                                        <input type="checkbox" id="projektSpace" checked={offerForm.projektSpace} onChange={(e) => setOfferForm({ ...offerForm, projektSpace: e.target.checked })} />
                                        <label htmlFor="projektSpace" style={{ margin: 0 }}>Projektraum Nutzung (+{prices.projektSpace}€/Nacht)</label>
                                    </div>

                                    <div className="checkbox-group">
                                        <input type="checkbox" id="projektSpaceCleaning" checked={offerForm.projektSpaceCleaning} onChange={(e) => setOfferForm({ ...offerForm, projektSpaceCleaning: e.target.checked })} />
                                        <label htmlFor="projektSpaceCleaning" style={{ margin: 0 }}>Projektraum Endreinigung (+{prices.projektSpaceCleaning}€ einmalig)</label>
                                    </div>

                                    <div className="form-group">
                                        <label>Rabatt (%)</label>
                                        <input type="number" min="0" max="100" step="1" value={offerForm.discountPercent} onChange={(e) => { const v = parseFloat(e.target.value); setOfferForm({ ...offerForm, discountPercent: isNaN(v) ? 0 : Math.max(0, Math.min(100, v)) }); }} placeholder="0" />
                                    </div>

                                    <div className="offer-summary">
                                        {nights > 0 && <div className="offer-row"><span>Nächte:</span><span>{nights}</span></div>}
                                        <div className="offer-row">
                                            <span>Zimmerpreis ({nights}×):</span>
                                            <span>
                                                {calculateStayBasePrice(offerForm.checkIn, offerForm.checkOut, offerForm.wohnung).toFixed(2)}€
                                            </span>
                                        </div>
                                        {offerForm.persons > getBasePersons(offerForm.wohnung) && (() => {
                                            const rows = [];
                                            const offerBasePersons = getBasePersons(offerForm.wohnung);
                                            for (let i = offerBasePersons; i < offerForm.persons; i++) {
                                                const extraPersonIndex = i - offerBasePersons;
                                                const personPrice = getExtraPersonPrice(extraPersonIndex);
                                                rows.push(
                                                    <div key={i} className="offer-row">
                                                        <span>Person {i + 1} ({nights}×):</span>
                                                        <span>+{(nights * personPrice).toFixed(2)}€</span>
                                                    </div>
                                                );
                                            }
                                            return rows;
                                        })()}
                                        {offerForm.earlyCheckin && <div className="offer-row"><span>Early Check-in:</span><span>+{prices.earlyCheckin}€</span></div>}
                                        {offerForm.lateCheckout && <div className="offer-row"><span>Late Checkout:</span><span>+{prices.lateCheckout}€</span></div>}
                                        {offerForm.finalCleaning && <div className="offer-row"><span>Endreinigung:</span><span>+{getFinalCleaning(offerForm.wohnung)}€</span></div>}
                                        {offerForm.dogFee && <div className="offer-row"><span>Hundegebühr ({offerForm.dogCount}×{nights}):</span><span>+{(offerForm.dogCount * nights * prices.dogFee).toFixed(2)}€</span></div>}
                                        {offerForm.projektSpace && <div className="offer-row"><span>Projektraum ({nights}×):</span><span>+{(prices.projektSpace * nights).toFixed(2)}€</span></div>}
                                        {offerForm.projektSpaceCleaning && <div className="offer-row"><span>Projektraum Endreinigung:</span><span>+{prices.projektSpaceCleaning}€</span></div>}
                                        {offerForm.discountPercent > 0 && (() => {
                                            const subtotal = calculateTotal({ ...offerForm, discountPercent: 0 });
                                            return (
                                                <React.Fragment>
                                                    <div className="offer-row"><span>Zwischensumme:</span><span>{subtotal.toFixed(2)}€</span></div>
                                                    <div className="offer-row"><span>Rabatt ({offerForm.discountPercent}%):</span><span>-{(subtotal - total).toFixed(2)}€</span></div>
                                                </React.Fragment>
                                            );
                                        })()}
                                        <div className="offer-total">
                                            Gesamtpreis: {total.toFixed(2)}€
                                        </div>
                                    </div>

                                    {offerForm.checkIn && offerForm.checkOut && hasBookedDateInRange(offerForm.checkIn, offerForm.checkOut, offerForm.wohnung, editingOfferId) && (
                                        <div className="error-message" style={{ marginBottom: '12px' }}>
                                            ✗ Dieser Zeitraum ist für {offerForm.wohnung === 'wohnung1' ? 'Wohnung I' : offerForm.wohnung === 'wohnung2' ? 'Wohnung II' : 'beide Wohnungen'} bereits belegt (manuelle Buchung oder Airbnb). {offerForm.ignoreOccupancyCheck ? 'Wird wegen aktivierter Überschreibung trotzdem erstellt.' : 'Bitte anderen Zeitraum wählen, oder hier die Belegungsprüfung ignorieren.'}
                                            <label style={{ display: 'flex', alignItems: 'center', gap: '6px', marginTop: '8px', fontWeight: 'normal' }}>
                                                <input
                                                    type="checkbox"
                                                    checked={offerForm.ignoreOccupancyCheck}
                                                    onChange={(e) => setOfferForm({ ...offerForm, ignoreOccupancyCheck: e.target.checked })}
                                                />
                                                Belegungsprüfung ignorieren (falls notwendig — z. B. bei bewusster Doppel-/Sonderbelegung)
                                            </label>
                                        </div>
                                    )}

                                    <button
                                        onClick={createOffer}
                                        disabled={!offerForm.guestId || !offerForm.checkIn || !offerForm.checkOut || nights <= 0 || (!offerForm.ignoreOccupancyCheck && hasBookedDateInRange(offerForm.checkIn, offerForm.checkOut, offerForm.wohnung, editingOfferId))}
                                        style={{ width: '100%' }}
                                    >
                                        {editingOfferId ? 'Änderungen speichern & E-Mail-Vorschau' : 'Angebot erstellen & E-Mail-Vorschau'}
                                    </button>
                                </div>
                            )}

                            <div>
                                {offers.map(offer => (
                                    <div key={offer.id} className="item-card">
                                        <div className="item-header">
                                            <div>
                                                <div className="item-title" style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                                    <input
                                                        type="text"
                                                        defaultValue={offerDisplayNumber(offer)}
                                                        key={offer.id + ':' + (offerNumberOverrides[offer.id] || '')}
                                                        onBlur={(e) => {
                                                            const auto = (() => {
                                                                const sorted = [...offers].sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                                                                const idx = sorted.findIndex(o => o.id === offer.id);
                                                                const seq = idx >= 0 ? idx + 1 : sorted.length + 1;
                                                                let year = new Date().getFullYear();
                                                                if (offer.created) {
                                                                    const parts = offer.created.split('.');
                                                                    if (parts.length === 3 && parseInt(parts[2], 10)) year = parseInt(parts[2], 10);
                                                                }
                                                                return `AN-${year}-${String(seq).padStart(4, '0')}`;
                                                            })();
                                                            setOfferNumberOverride(offer.id, e.target.value === auto ? '' : e.target.value);
                                                        }}
                                                        style={{ fontSize: '16px', fontWeight: '600', border: '1px dashed var(--licht-40, #999)', borderRadius: '4px', background: 'rgba(255,255,255,0.05)', padding: '3px 6px', width: '160px', color: offerNumberOverrides[offer.id] ? 'var(--accent)' : 'inherit', cursor: 'text' }}
                                                        title="Klicken zum Bearbeiten der Angebotsnummer"
                                                    />
                                                    <span style={{ fontSize: '11px', color: 'var(--licht-70)' }}>✏️</span>
                                                    {offerNumberOverrides[offer.id] && (
                                                        <button className="secondary" style={{ padding: '2px 6px', fontSize: '11px' }} onClick={() => setOfferNumberOverride(offer.id, '')} title="Auf automatische Nummer zurücksetzen">↺</button>
                                                    )}
                                                </div>
                                                <div className="item-meta">{offer.guest.name} • {offer.created}</div>
                                            </div>
                                            <div style={{ textAlign: 'right' }}>
                                                <div style={{ fontSize: '18px', fontWeight: '600', color: 'var(--accent)', marginBottom: '4px' }}>{safeNum(offer.total).toFixed(2)}€</div>
                                                <div className={offer.status === 'sent' ? 'status-pending' : 'status-paid'}>
                                                    {offer.status === 'sent' ? '📧 Versendet' : '✓ Gebucht'}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="item-meta">{offer.wohnung === 'wohnung1' ? 'Wohnung I' : 'Wohnung II'} • {offer.nights} Nächte • {offer.checkIn} bis {offer.checkOut}</div>
                                        <div className="button-group" style={{ marginTop: '12px' }}>
                                            <button className="secondary" onClick={() => openOfferMailPreview(offer)}>📧 Mail anzeigen</button>
                                            <button className="secondary" onClick={() => printOffer(offer)}>🖨️ Drucken / PDF</button>
                                            <button onClick={() => sendOfferWithAttachment(offer)}>📎 PDF an Mail anhängen &amp; senden</button>
                                            <button className="secondary" onClick={() => startEditOffer(offer)}>✏️ Bearbeiten</button>
                                            <button className="secondary" onClick={() => { applySourceToInvoice('offer:' + offer.id); setActiveTab('invoices'); setShowInvoiceForm(true); }}>🧾 Rechnung erstellen</button>
                                            {offer.status === 'sent' && (
                                                <button className="success" onClick={() => convertToBooking(offer)}>✓ Zur Buchung</button>
                                            )}
                                            <button className="danger" onClick={() => deleteOffer(offer.id)}>Löschen</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* BUCHUNGEN */}
                    {activeTab === 'bookings' && (
                        <div>
                            {bookings.map(booking => (
                                <div key={booking.id} className="item-card">
                                    <div className="item-header">
                                        <div>
                                            <div className="item-title">{booking.id}</div>
                                            <div className="item-meta">{booking.guest.name} • {booking.created}</div>
                                        </div>
                                        <div style={{ textAlign: 'right' }}>
                                            <div style={{ fontSize: '18px', fontFamily: 'var(--font-serif)', fontWeight: '600', color: 'var(--accent)' }}>{safeNum(booking.total).toFixed(2)}€</div>
                                        </div>
                                    </div>
                                    <div className="item-meta">{booking.wohnung === 'wohnung1' ? 'Wohnung I' : 'Wohnung II'} • {booking.checkIn} bis {booking.checkOut}</div>

                                    <div style={{ marginTop: '16px', padding: '12px', backgroundColor: 'var(--licht-15)', borderRadius: '6px' }}>
                                        <div style={{ fontWeight: '600', marginBottom: '12px', fontSize: '14px' }}>Zahlungsdetails:</div>
                                        
                                        <div className="payment-row">
                                            <div>
                                                <div className="payment-label">1. Kaution</div>
                                                <div style={{ fontSize: '12px', color: 'var(--licht-70)' }}>Wird nach Checkout zurückerstattet</div>
                                            </div>
                                            <div>
                                                <div className="payment-amount">{booking.deposit}€</div>
                                                <div className={booking.depositPaid ? 'payment-status' : 'payment-pending'}>
                                                    {booking.depositPaid ? '✓ Bezahlt' : '⏳ Ausstehend'}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="payment-row">
                                            <div>
                                                <div className="payment-label">2. Anzahlung ({downPaymentPercent}%)</div>
                                                <div style={{ fontSize: '12px', color: 'var(--licht-70)' }}>Bei Buchungsbestätigung fällig</div>
                                            </div>
                                            <div>
                                                <div className="payment-amount">{booking.downPayment}€</div>
                                                <div className={booking.downPaymentPaid ? 'payment-status' : 'payment-pending'}>
                                                    {booking.downPaymentPaid ? '✓ Bezahlt' : '⏳ Ausstehend'}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="payment-row">
                                            <div>
                                                <div className="payment-label">3. Restbetrag</div>
                                                <div style={{ fontSize: '12px', color: 'var(--licht-70)' }}>Zahlbar vor Anreise</div>
                                            </div>
                                            <div>
                                                <div className="payment-amount">{safeNum(booking.remaining).toFixed(2)}€</div>
                                                <div className={booking.remainingPaid ? 'payment-status' : 'payment-pending'}>
                                                    {booking.remainingPaid ? '✓ Bezahlt' : '⏳ Ausstehend'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="button-group" style={{ marginTop: '12px' }}>
                                        {!booking.depositPaid && (
                                            <button className="success" onClick={() => markPaymentDone(booking.id, 'deposit')}>✓ Kaution bezahlt</button>
                                        )}
                                        {booking.depositPaid && !booking.downPaymentPaid && (
                                            <button className="success" onClick={() => markPaymentDone(booking.id, 'downpayment')}>✓ Anzahlung bezahlt</button>
                                        )}
                                        {booking.downPaymentPaid && !booking.remainingPaid && (
                                            <button className="success" onClick={() => markPaymentDone(booking.id, 'remaining')}>✓ Restzahlung erhalten</button>
                                        )}
                                        <button className="secondary" onClick={() => { applySourceToInvoice('booking:' + booking.id); setActiveTab('invoices'); setShowInvoiceForm(true); }}>🧾 Rechnung (Gesamtbetrag)</button>
                                        <button className="secondary" onClick={() => applyBookingLegToInvoice(booking.id, 'downpayment')}>🧾 Rechnung (nur Anzahlung)</button>
                                        <button className="secondary" onClick={() => applyBookingLegToInvoice(booking.id, 'remaining')}>🧾 Rechnung (nur Restbetrag)</button>
                                        <button className="danger" onClick={() => deleteBooking(booking.id)}>Löschen</button>
                                    </div>
                                </div>
                            ))}
                            {bookings.length === 0 && <p style={{ color: 'var(--licht-70)', textAlign: 'center', padding: '40px 0' }}>Noch keine Buchungen</p>}
                        </div>
                    )}

                    {/* BELEGUNG */}
                    {activeTab === 'occupancy' && (
                        <div>
                            <div className="card">
                                <h3>🚫 Zeitraum blockieren</h3>
                                <p style={{ fontSize: '12px', color: 'var(--licht-70)', marginTop: 0 }}>
                                    Für Eigennutzung, Wartung oder sonstige Sperrungen — unabhängig von einer echten Gästebuchung.
                                    Blockiert den Kalender genauso wie eine Buchung, inklusive Airbnb-Export.
                                </p>
                                <button style={{ marginBottom: '16px' }} onClick={() => setShowBlockForm(!showBlockForm)}>
                                    {showBlockForm ? '✕ Abbrechen' : '+ Zeitraum blockieren'}
                                </button>

                                {showBlockForm && (
                                    <div>
                                        <div className="grid">
                                            <div className="form-group">
                                                <label>Wohnung</label>
                                                <select value={blockForm.wohnung} onChange={(e) => setBlockForm({ ...blockForm, wohnung: e.target.value })}>
                                                    <option value="wohnung1">Wohnung I</option>
                                                    <option value="wohnung2">Wohnung II</option>
                                                    <option value="both">Beide Wohnungen</option>
                                                </select>
                                            </div>
                                            <div className="form-group">
                                                <label>Von</label>
                                                <input type="date" value={blockForm.checkIn} onChange={(e) => setBlockForm({ ...blockForm, checkIn: e.target.value })} />
                                            </div>
                                            <div className="form-group">
                                                <label>Bis</label>
                                                <input type="date" value={blockForm.checkOut} onChange={(e) => setBlockForm({ ...blockForm, checkOut: e.target.value })} />
                                            </div>
                                        </div>

                                        <p style={{ fontSize: '12px', color: 'var(--licht-70)', marginBottom: 0 }}>
                                            Kalender zur Übersicht — Klick auf einen freien Tag wählt den Start, ein zweiter Klick das Ende. Rot = bereits belegt/blockiert (Buchungen, andere Blockierungen und Airbnb-Sync).
                                        </p>
                                        {renderBlockCalendarMonth()}

                                        <div className="form-group">
                                            <label>Grund (optional, nur intern sichtbar)</label>
                                            <input type="text" value={blockForm.reason} onChange={(e) => setBlockForm({ ...blockForm, reason: e.target.value })} placeholder="z.B. Eigennutzung, Renovierung..." />
                                        </div>
                                        <button onClick={createBlockedPeriod}>Blockierung speichern</button>
                                    </div>
                                )}
                            </div>

                            <h4 style={{ marginTop: '20px', marginBottom: '12px' }}>Aktuell blockierte Zeiträume</h4>
                            {blockedPeriods.length === 0 && <p style={{ color: 'var(--licht-70)', textAlign: 'center', padding: '20px 0' }}>Keine manuellen Blockierungen vorhanden</p>}
                            {blockedPeriods.map(bp => (
                                <div key={bp.id} className="item-card" style={{ padding: '10px 14px', marginBottom: '8px' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <span style={{ fontSize: '13px' }}>
                                            {wohnungLabel(bp.wohnung)} · {bp.checkIn} bis {bp.checkOut}
                                            {bp.reason && <span style={{ color: 'var(--licht-70)' }}> — {bp.reason}</span>}
                                        </span>
                                        <button className="danger" onClick={() => deleteBlockedPeriod(bp.id)}>Aufheben</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* EINNAHMEN */}
                    {activeTab === 'revenue' && (() => {
                        const totalRevenue = bookings.reduce((s, b) => s + safeNum(b.total), 0);
                        const receivedDownPayments = bookings.reduce((s, b) => s + (b.downPaymentPaid ? safeNum(b.downPayment) : 0), 0);
                        const receivedRemaining = bookings.reduce((s, b) => s + (b.remainingPaid ? safeNum(b.remaining) : 0), 0);
                        const receivedTotal = receivedDownPayments + receivedRemaining;
                        const outstanding = totalRevenue - receivedTotal;
                        const byMonth = revenueByMonth();
                        const maxMonth = Math.max(1, ...byMonth.map(([, v]) => v));
                        const byWohnung = revenueByWohnung();
                        const maxWohnung = Math.max(1, byWohnung.wohnung1.total, byWohnung.wohnung2.total, byWohnung.both.total);
                        const wohnungRows = [
                            ['wohnung1', 'Wohnung I'],
                            ['wohnung2', 'Wohnung II'],
                            ['both', 'Beide Wohnungen'],
                        ];

                        return (
                            <div>
                                <div className="stat-grid">
                                    <div className="stat-card">
                                        <div className="stat-number">{totalRevenue.toFixed(0)}€</div>
                                        <div className="stat-label">Gesamtumsatz (alle Buchungen)</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-number">{receivedTotal.toFixed(0)}€</div>
                                        <div className="stat-label">Bereits erhalten (Anzahlung + Restzahlung)</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-number">{outstanding.toFixed(0)}€</div>
                                        <div className="stat-label">Noch ausstehend (Restzahlungen)</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-number">{bookings.length}</div>
                                        <div className="stat-label">Buchungen gesamt</div>
                                    </div>
                                </div>

                                <div style={{ fontSize: '12px', color: 'var(--licht-70)', margin: '-8px 0 20px' }}>
                                    Hinweis: Die Kaution ist nicht als Umsatz enthalten, da sie nach dem Aufenthalt zurückerstattet wird.
                                    „Noch ausstehend" umfasst alle noch nicht als bezahlt markierten Anzahlungen und Restzahlungen.
                                </div>

                                <div className="card">
                                    <h3>Umsatz pro Monat (nach Anreisedatum)</h3>
                                    {byMonth.length === 0 ? (
                                        <p style={{ color: 'var(--licht-70)' }}>Noch keine Buchungen</p>
                                    ) : (
                                        byMonth.map(([key, value]) => (
                                            <div key={key} style={{ marginBottom: '12px' }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', marginBottom: '4px' }}>
                                                    <span>{formatMonthKey(key)}</span>
                                                    <span style={{ fontWeight: '600' }}>{value.toFixed(2)}€</span>
                                                </div>
                                                <div style={{ background: 'var(--licht-08)', borderRadius: '4px', height: '10px', overflow: 'hidden' }}>
                                                    <div style={{ width: `${(value / maxMonth) * 100}%`, background: 'var(--accent)', height: '100%' }}></div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <div className="card">
                                    <h3>Umsatz nach Wohnung</h3>
                                    {wohnungRows.map(([key, label]) => (
                                        <div key={key} style={{ marginBottom: '12px' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', marginBottom: '4px' }}>
                                                <span>{label} ({byWohnung[key].count} Buchungen)</span>
                                                <span style={{ fontWeight: '600' }}>{byWohnung[key].total.toFixed(2)}€</span>
                                            </div>
                                            <div style={{ background: 'var(--licht-08)', borderRadius: '4px', height: '10px', overflow: 'hidden' }}>
                                                <div style={{ width: `${(byWohnung[key].total / maxWohnung) * 100}%`, background: 'var(--prism-gelb)', height: '100%' }}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="card">
                                    <h3>Zahlungsstatus je Buchung</h3>
                                    {bookings.length === 0 ? (
                                        <p style={{ color: 'var(--licht-70)' }}>Noch keine Buchungen</p>
                                    ) : (
                                        bookings.slice().reverse().map(b => {
                                            const downPaymentInvoice = b.downPaymentInvoiceId ? invoices.find(i => i.id === b.downPaymentInvoiceId) : null;
                                            const remainingInvoice = b.remainingInvoiceId ? invoices.find(i => i.id === b.remainingInvoiceId) : null;
                                            return (
                                                <div key={b.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid var(--licht-08)' }}>
                                                    <div>
                                                        <div style={{ fontWeight: '600' }}>{b.id}</div>
                                                        <div style={{ fontSize: '12px', color: 'var(--licht-70)' }}>{b.guest.name} • {b.checkIn} bis {b.checkOut}</div>
                                                        {(downPaymentInvoice || remainingInvoice) && (
                                                            <div style={{ fontSize: '12px', color: 'var(--licht-70)' }}>
                                                                {downPaymentInvoice && <>Anzahlung: {invoiceDisplayNumber(downPaymentInvoice)}</>}
                                                                {downPaymentInvoice && remainingInvoice && ' · '}
                                                                {remainingInvoice && <>Restzahlung: {invoiceDisplayNumber(remainingInvoice)}</>}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div style={{ textAlign: 'right' }}>
                                                        <div style={{ fontWeight: '600' }}>{safeNum(b.total).toFixed(2)}€</div>
                                                        <div className={b.status === 'completed' ? 'status-paid' : 'status-pending'}>
                                                            {b.status === 'completed' ? '✓ Vollständig bezahlt' : b.status === 'confirmed' ? '⏳ Restzahlung ausstehend' : b.status === 'awaiting_downpayment' ? '⏳ Anzahlung ausstehend' : '⏳ Kaution ausstehend'}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        );
                    })()}

                    {/* RECHNUNGEN */}
                    {activeTab === 'invoices' && (

                                            {inquiries.length > 0 && (
                                                <optgroup label="Anfragen">
                                                    {inquiries.map(i => (
                                                        <option key={'inq-' + i.id} value={`inquiry:${i.id}`}>{i.id} · {i.name} · {i.checkIn} – {i.checkOut}</option>
                                                    ))}
                                                </optgroup>

                                            {bookings.length > 0 && (
                                                <optgroup label="Buchungen">
                                                    {bookings.map(b => (
                                                        <option key={'buk-' + b.id} value={`booking:${b.id}`}>{b.id} · {b.guest.name} · {b.checkIn} – {b.checkOut}</option>
                                                    ))}
                                                </optgroup>
                                            )}
                                            {guests.length > 0 && (
                                                <optgroup label="Gäste-Adressbuch">
                                                    {guests.map(g => (
                                                        <option key={'gst-' + g.id} value={`guest:${g.id}`}>{g.name} ({g.email})</option>

                                                </optgroup>
