    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --nachtblau:   #0d1a2a;
            --tintenblau:  #1a2d3d;
            --schiefblau:  #223344;
            --rauchgruen:  #1a2e22;
            --moosgruen:   #2a4030;
            --waldgruen:   #344d3a;
            --ocker-dunkel:#3d2e14;
            --bernstein:   #5a4020;
            --staub:       #3a3530;
            
            --licht:       #e8e0d0;
            --licht-70:    rgba(232,224,208,.72);
            --licht-40:    rgba(232,224,208,.42);
            --licht-15:    rgba(232,224,208,.16);
            --licht-08:    rgba(232,224,208,.08);
            
            --accent:      #c8a43a;
            --prism-gelb:  rgba(180,140,40,.55);
            --prism-blau:  rgba(60,100,160,.45);
            --prism-gruen: rgba(60,120,80,.40);
            
            --s1:  .5rem;   --s2:.8rem;    --s3:1.375rem;
            --s5:  1.625rem; --s8:2.625rem; --s13:4.25rem;
            --s21: 6.875rem; --s34:11.125rem;
            
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Jost', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--nachtblau);
            color: var(--licht);
            font-family: var(--font-sans);
            line-height: 1.6;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-serif);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        h1 { font-size: 32px; }
        h2 { font-size: 24px; }
        h3 { font-size: 20px; }
        h4 { font-size: 16px; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            background: linear-gradient(135deg, var(--tintenblau) 0%, var(--nachtblau) 100%);
            border-bottom: 1px solid var(--licht-08);
            padding: 30px 0;
            margin-bottom: 40px;
        }

        header .container {
            padding: 30px 20px;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--licht);
            display: flex;
            align-items: center;
            gap: var(--s3);
        }

        .tagline {
            font-size: 14px;
            color: var(--licht-70);
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--licht-08);
            margin-bottom: 30px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--nachtblau);
            box-shadow: 0 4px 12px rgba(0,0,0,.25);
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 14px 18px;
            cursor: pointer;
            color: var(--licht-70);
            border-bottom: 2px solid transparent;
            font-size: 14px;
            font-family: var(--font-sans);
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--licht);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .card {
            background: var(--tintenblau);
            border: 1px solid var(--licht-08);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--tintenblau);
            border: 1px solid var(--licht-08);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--licht-70);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--licht);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--licht-08);
            border-radius: 6px;
            font-size: 14px;
            font-family: var(--font-sans);
            background-color: var(--nachtblau);
            color: var(--licht);
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 164, 58, 0.15);
        }

        button {
            background: var(--accent);
            color: var(--licht);
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-sans);
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--accent);
        }

        button.secondary {
            background: var(--tintenblau);
            color: var(--licht);
            border: 1px solid var(--licht-08);
        }

        button.secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.success {
            background: var(--rauchgruen);
        }

        button.success:hover {
            background: #7aa890;
        }

        button.danger {
            background: var(--bernstein);
        }

        button.danger:hover {
            background: #b97070;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .item-card {
            background: var(--tintenblau);
            border: 1px solid var(--licht-08);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            border-color: var(--accent);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .item-title {
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .item-meta {
            font-size: 13px;
            color: var(--licht-70);
            margin-bottom: 8px;
        }

        .mail-preview {
            background: var(--nachtblau);
            border: 1px solid var(--licht-08);
            border-radius: 6px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #ccc;
        }

        .payment-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--licht-08);
        }

        .payment-row:last-child {
            border-bottom: none;
        }

        .payment-label {
            flex: 1;
        }

        .payment-amount {
            font-weight: 600;
            color: var(--accent);
        }

        .payment-status {
            font-size: 12px;
            color: var(--rauchgruen);
        }

        .payment-pending {
            font-size: 12px;
            color: var(--prism-gelb);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--tintenblau);
            border: 1px solid var(--licht-08);
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .status-paid {
            background: rgba(107, 144, 128, 0.2);
            color: var(--rauchgruen);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pending {
            background: rgba(201, 168, 118, 0.2);
            color: var(--prism-gelb);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .offer-summary {
            background: rgba(139, 115, 85, 0.1);
            border: 1px solid var(--licht-08);
            border-radius: 6px;
            padding: 12px;
            margin: 16px 0;
        }

        .offer-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .offer-total {
            font-weight: 600;
            color: var(--accent);
            border-top: 1px solid var(--licht-08);
            padding-top: 8px;
            margin-top: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid var(--licht-08);
            margin-top: 60px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .button-group button {
            flex: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 16px;
            }

            h1 {
                font-size: 24px;
            }

            .tabs {
                margin-bottom: 20px;
            }

            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .item-header {
                flex-direction: column;
                gap: 8px;
            }
        }

        .blockcal { max-width: 360px; margin: 16px 0; }
        .blockcal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .blockcal-weekday {
            text-align: center;
            font-size: 11px;
            color: var(--licht-70);
            padding-bottom: 4px;
        }
        .blockcal-tag {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border-radius: 4px;
            background: rgba(255,255,255,.04);
        }
        .blockcal-tag.leer { background: transparent; }
        .blockcal-tag.past { opacity: .3; }
        .blockcal-tag.belegt {
            background: rgba(180,70,55,.4);
            color: rgba(232,224,208,.5);
            cursor: not-allowed !important;
        }
        .blockcal-tag.belegt.halb-an {
            background: linear-gradient(135deg, transparent 50%, rgba(180,70,55,.4) 50%);
        }
        .blockcal-tag.ausgewaehlt {
            background: rgba(200,164,58,.4);
            color: var(--licht);
        }
        .blockcal-tag.halb-ab {
            background: linear-gradient(135deg, rgba(180,70,55,.35) 50%, transparent 50%);
        }
        .blockcal-tag.halb-vor {
            background: linear-gradient(135deg, transparent 50%, rgba(180,70,55,.35) 50%);
        }
        .blockcal-tag:not(.leer):not(.past):not(.belegt):hover {
            background: rgba(255,255,255,.1);
        }
        .blockcal-legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 4px;
            vertical-align: middle;
        }
        .blockcal-legend-dot.belegt { background: rgba(180,70,55,.4); }
        .blockcal-legend-dot.ausgewaehlt { background: rgba(200,164,58,.4); }
        .blockcal-legend-dot.halb { background: linear-gradient(135deg, rgba(180,70,55,.35) 50%, transparent 50%); }
    </style>
</head>
<body>

    <div id="root"></div>

    <footer>
        <p>Greenhouse Market GbR • Brandenburger Str. 17 • 16848 Fürstenberg/Havel</p>
    </footer>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Fängt Rendering-Fehler in einem Tab ab, zeigt sie sichtbar an und bietet
        // einen Reset-Button, damit die App bei einem Fehler nie "hängen" bleibt.
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { error: null };
            }
            static getDerivedStateFromError(error) {
                return { error };
            }
            componentDidCatch(error, info) {
                console.error('Von ErrorBoundary abgefangener Fehler:', error, info);
            }
            componentDidUpdate(prevProps) {
                if (prevProps.resetKey !== this.props.resetKey && this.state.error) {
                    this.setState({ error: null });
                }
            }
            render() {
                if (this.state.error) {
                    return (
                        <div className="card" style={{ borderColor: '#c0392b', borderWidth: '2px', borderStyle: 'solid' }}>
                            <h3 style={{ color: '#e74c3c', marginTop: 0 }}>⚠ Hier ist ein Fehler aufgetreten</h3>
                            <p style={{ fontSize: '13px', color: 'var(--licht-70)' }}>
                                Damit du nicht "stecken bleibst": Klicke unten, um zum Dashboard zurückzukehren.
                                Bitte schick mir den folgenden Text, wenn das Problem öfter auftritt:
                            </p>
                            <pre style={{ fontSize: '11px', color: '#e74c3c', whiteSpace: 'pre-wrap', background: 'rgba(0,0,0,.3)', padding: '10px', borderRadius: '4px', overflowX: 'auto' }}>
                                {String((this.state.error && this.state.error.message) || this.state.error)}
                            </pre>
                            <button onClick={() => { this.setState({ error: null }); this.props.onReset(); }}>← Zurück zum Dashboard</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Adresse eures Backend-Workers — hier ändern, falls ihr unter einer anderen
        // Domain deployt (z. B. während eines Tests unter einer *.workers.dev-URL).
        const API_BASE = 'https://greenhouse-fuerstenberg.de';

        function LoginScreen({ onLogin }) {
            const [tokenInput, setTokenInput] = useState('');
            const [error, setError] = useState('');
            const [checking, setChecking] = useState(false);
            const [showPassword, setShowPassword] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setChecking(true);
                try {
                    const res = await fetch(`${API_BASE}/api/settings`, {
                        headers: { 'Authorization': `Bearer ${tokenInput}` },
                    });
                    if (res.status === 401) {
                        setError('Falsches Zugangspasswort. Bitte erneut versuchen.');
                        setChecking(false);
                        return;
                    }
                    if (!res.ok) {
                        setError(`Der Server hat mit Status ${res.status} geantwortet. Ist das Backend korrekt deployt?`);
                        setChecking(false);
                        return;
                    }
                    sessionStorage.setItem('greenhouse_admin_token', tokenInput);
                    onLogin(tokenInput);
                } catch (err) {
                    setError('Verbindung zum Server fehlgeschlagen: ' + err.message + ' — ist das Backend erreichbar?');
                    setChecking(false);
                }
            };

            return (
                <div style={{ maxWidth: '380px', margin: '100px auto', padding: '0 20px' }}>
                    <div className="card">
                        <h2 style={{ marginTop: 0, textAlign: 'center' }}>🔒 Greenhouse Booking-System</h2>
                        <p style={{ fontSize: '13px', color: 'var(--licht-70)', textAlign: 'center', marginBottom: '20px' }}>
                            Bitte gib das Zugangspasswort ein, um fortzufahren.
                        </p>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Zugangspasswort</label>
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <input type={showPassword ? 'text' : 'password'} value={tokenInput} onChange={(e) => setTokenInput(e.target.value)} autoFocus style={{ flex: 1 }} />
                                    <button type="button" className="secondary" onClick={() => setShowPassword(!showPassword)} style={{ whiteSpace: 'nowrap' }}>
                                        {showPassword ? '🙈 Verbergen' : '👁️ Anzeigen'}
                                    </button>
                                </div>
                            </div>
                            {error && <div className="error-message" style={{ marginBottom: '12px' }}>{error}</div>}

                function parseIcal(text) {
                    const tage = new Set();
                    const lines = text.replace(/\r/g, '').split('\n');
                    let inEvent = false, dtstart = null, dtend = null;
                    lines.forEach((line) => {
                        if (line === 'BEGIN:VEVENT') { inEvent = true; dtstart = null; dtend = null; }
                        else if (line === 'END:VEVENT') {
                            if (inEvent && dtstart && dtend) {
                                const d = new Date(dtstart);
                                while (d < dtend) {
                                    tage.add(d.toISOString().slice(0, 10));
                                    d.setDate(d.getDate() + 1);
                                }
                            }
                            inEvent = false;
                        } else if (inEvent) {
                            let m;
                            if ((m = line.match(/^DTSTART(?:;[^:]*)?:([0-9]{8})/))) {
                                const v = m[1];
                                dtstart = new Date(v.slice(0, 4) + '-' + v.slice(4, 6) + '-' + v.slice(6, 8));
                            }
                            if ((m = line.match(/^DTEND(?:;[^:]*)?:([0-9]{8})/))) {

            // Berechnet Ostersonntag für ein gegebenes Jahr (Gauß'sche Osterformel).
            // Daraus lassen sich Karfreitag, Ostermontag, Christi Himmelfahrt und
            // Pfingsten ableiten — alle anderen deutschen Feiertage sind Fixdaten.
            const calculateEasterSunday = (year) => {
                const a = year % 19;
                const b = Math.floor(year / 100);
                const c = year % 100;
                const d = Math.floor(b / 4);
                const e = b % 4;
                const f = Math.floor((b + 8) / 25);
                const g = Math.floor((b - f + 1) / 3);
                const h = (19 * a + b - d - g + 15) % 30;
                const i = Math.floor(c / 4);
                const k = c % 4;
                const l = (32 + 2 * e + 2 * i - h - k) % 7;
                const m = Math.floor((a + 11 * h + 22 * l) / 451);
                const month = Math.floor((h + l - 7 * m + 114) / 31);
                const day = ((h + l - 7 * m + 114) % 31) + 1;
                return new Date(Date.UTC(year, month - 1, day));
            };

            const addDaysToDate = (date, days) => {
                const d = new Date(date);
                d.setUTCDate(d.getUTCDate() + days);
                return d;
            };
            const toDateStr = (date) => date.toISOString().split('T')[0];

            // Gesetzliche Feiertage Brandenburg für ein Jahr — inkl. Reformationstag
            // (in Brandenburg gesetzlicher Feiertag, anders als in manchen Bundesländern).
            const germanHolidaysForYear = (year) => {
                const easter = calculateEasterSunday(year);
                const holidays = [
                    { date: `${year}-01-01`, label: 'Neujahr' },
                    { date: toDateStr(addDaysToDate(easter, -2)), label: 'Karfreitag' },
                    { date: toDateStr(easter), label: 'Ostersonntag' },
                    { date: toDateStr(addDaysToDate(easter, 1)), label: 'Ostermontag' },
                    { date: `${year}-05-01`, label: 'Tag der Arbeit' },
                    { date: toDateStr(addDaysToDate(easter, 39)), label: 'Christi Himmelfahrt' },
                    { date: toDateStr(addDaysToDate(easter, 49)), label: 'Pfingstsonntag' },
                    { date: toDateStr(addDaysToDate(easter, 50)), label: 'Pfingstmontag' },
                    { date: `${year}-10-03`, label: 'Tag der Deutschen Einheit' },
                    { date: `${year}-10-31`, label: 'Reformationstag' },
                    { date: `${year}-12-25`, label: '1. Weihnachtsfeiertag' },
                    { date: `${year}-12-26`, label: '2. Weihnachtsfeiertag' },
                ];
                return holidays;
            };

            // Cache über mehrere Jahre hinweg (Kalender kann Jahresgrenzen überschreiten).
            const getHolidaysForDateRange = (startYear, endYear) => {
                let all = [];
                for (let y = startYear; y <= endYear; y++) all = all.concat(germanHolidaysForYear(y));
                return all;
            };

            const isSchoolHoliday = (dateStr) => {
                return schoolHolidays.some(h => dateStr >= h.startDate && dateStr <= h.endDate);
            };

            const getPublicHoliday = (dateStr) => {
                const year = parseInt(dateStr.split('-')[0], 10);
                const holidays = germanHolidaysForYear(year);
                return holidays.find(h => h.date === dateStr) || null;
            };

            // Ermittelt den Preis für EINE konkrete Nacht (nicht den ganzen Aufenthalt):
            // 1. Individueller Preiszeitraum (z. B. Silvester) — falls vorhanden, hat Vorrang
            // 2. Sonst: Wochenend-Preis (Fr/Sa/So), falls gepflegt
            // 3. Sonst: regulärer Wochentag-Preis (Mo-Do)
            const nightlyBasePrice = (dateStr, wohnung) => {
                const override = priceOverrides.find(ov =>
                    dateStr >= ov.startDate && dateStr <= ov.endDate &&
                    (ov.wohnung === wohnung || ov.wohnung === 'all')
                );
                if (override) return override.pricePerNight;

                const day = new Date(dateStr + 'T00:00:00Z').getUTCDay(); // 0=So,1=Mo,...,5=Fr,6=Sa
                const isWeekend = (day === 5 || day === 6 || day === 0); // Fr, Sa, So
                if (isWeekend) {
                    const weekendKey = wohnung === 'wohnung1' ? 'weekendWohnung1' : wohnung === 'wohnung2' ? 'weekendWohnung2' : 'weekendBoth';
                    if (prices[weekendKey]) return prices[weekendKey];
                }
                return prices[wohnung] || 0;
            };

            // Summiert die Übernachtungspreise für den gesamten Aufenthalt (ersetzt
            // die frühere einfache "nights * Preis"-Rechnung durch eine tagesgenaue).
            const calculateStayBasePrice = (checkIn, checkOut, wohnung) => {
                if (!checkIn || !checkOut) return 0;
                let total = 0;
                let cur = checkIn;
                while (cur < checkOut) {
                    total += nightlyBasePrice(cur, wohnung);
                    cur = toDateStr(addDaysToDate(new Date(cur + 'T00:00:00Z'), 1));
                }
                return total;
            };

            // Baut die Unterkunfts-Rechnungsposten für einen Aufenthalt. Bei einheitlichem
            // Preis über den ganzen Zeitraum: ein Posten wie bisher. Falls sich der Preis
            // unterscheidet (Wochenende, individueller Zeitraum wie Weihnachten etc.):
            // mehrere, klar beschriftete Posten — für volle Transparenz auf der Rechnung.
            const buildAccommodationLineItems = (checkIn, checkOut, wohnung) => {
                if (!checkIn || !checkOut) return [];
                const groups = {};
                let cur = checkIn;
                while (cur < checkOut) {
                    const override = priceOverrides.find(ov =>
                        cur >= ov.startDate && cur <= ov.endDate &&
                        (ov.wohnung === wohnung || ov.wohnung === 'all')
                    );
                    const day = new Date(cur + 'T00:00:00Z').getUTCDay();
                    const isWeekend = (day === 5 || day === 6 || day === 0);
                    let price, label;
                    if (override) {
                        price = override.pricePerNight;
                        label = override.label || 'Sondertarif';
                    } else if (isWeekend) {
                        const weekendKey = wohnung === 'wohnung1' ? 'weekendWohnung1' : wohnung === 'wohnung2' ? 'weekendWohnung2' : 'weekendBoth';
                        if (prices[weekendKey]) {
                            price = prices[weekendKey];
                            label = 'Wochenende';
                        } else {
                            price = prices[wohnung] || 0;
                            label = 'Standard';
                        }
                    } else {
                        price = prices[wohnung] || 0;
                        label = 'Standard';
                    }
                    const key = `${label}|${price}`;
                    if (!groups[key]) groups[key] = { price, label, count: 0 };
                    groups[key].count++;
                    cur = toDateStr(addDaysToDate(new Date(cur + 'T00:00:00Z'), 1));
                }
                const entries = Object.values(groups);
                const wl = wohnung === 'wohnung1' ? 'Wohnung I' : wohnung === 'wohnung2' ? 'Wohnung II' : 'Beide Wohnungen';
                return entries.map(g => ({
                    description: entries.length > 1
                        ? `Unterkunft ${wl} – ${g.label} (${g.count} ${g.count === 1 ? 'Nacht' : 'Nächte'})`
                        : `Unterkunft ${wl} (${g.count} ${g.count === 1 ? 'Nacht' : 'Nächte'})`,
                    quantity: g.count,
                    unitPrice: g.price,
                }));
            };

            const calculateNights = (checkIn, checkOut) => {
                if (!checkIn || !checkOut) return 0;
                const start = new Date(checkIn);
                const end = new Date(checkOut);
                return Math.ceil((end - start) / (1000 * 60 * 60 * 24));
            };

            const calculateTotal = (formData) => {
                if (!formData.checkIn || !formData.checkOut) return 0;
                const nights = calculateNights(formData.checkIn, formData.checkOut);

                let total = calculateStayBasePrice(formData.checkIn, formData.checkOut, formData.wohnung);

                // Zusatzgebühr für Personen über Basisanzahl - individuelle Preise
                const basePersonsForWohnung = getBasePersons(formData.wohnung);
                if (formData.persons > basePersonsForWohnung) {
                    for (let i = basePersonsForWohnung; i < formData.persons; i++) {
                        const extraPersonIndex = i - basePersonsForWohnung;
                        const personPrice = getExtraPersonPrice(extraPersonIndex);
                        total += personPrice * nights;
                    }
                }

                if (formData.earlyCheckin) total += prices.earlyCheckin;
                if (formData.lateCheckout) total += prices.lateCheckout;
                if (formData.finalCleaning) total += getFinalCleaning(formData.wohnung);
                if (formData.dogFee) total += prices.dogFee * formData.dogCount * nights;
                if (formData.projektSpace) total += prices.projektSpace * nights;
                if (formData.projektSpaceCleaning) total += prices.projektSpaceCleaning;

                const discountPercent = Math.max(0, Math.min(100, parseFloat(formData.discountPercent) || 0));
                if (discountPercent > 0) total -= total * (discountPercent / 100);

                return total;
            };

            const createOffer = async () => {
                if (!offerForm.checkIn || !offerForm.checkOut) return;

                let guest;
                if (editingOfferId) {
                    const existingOffer = offers.find(o => o.id === editingOfferId);
                    // Bevorzugt einen Eintrag aus dem Gäste-Adressbuch, fällt aber auf die
                    // eingebetteten Gästedaten des bestehenden Angebots zurück — nötig für
                    // Angebote, die direkt aus einer Anfrage entstanden sind (deren guestId
                    // ist die Anfrage-ID, kein echter Adressbuch-Eintrag).
                    guest = guests.find(g => g.id === parseInt(offerForm.guestId)) || (existingOffer && existingOffer.guest);
                } else {
                    if (!offerForm.guestId) return;
                    guest = guests.find(g => g.id === parseInt(offerForm.guestId));
                }
                if (!guest) return;

                if (!offerForm.ignoreOccupancyCheck && hasBookedDateInRange(offerForm.checkIn, offerForm.checkOut, offerForm.wohnung, editingOfferId)) {
                    alert('Der gewählte Zeitraum ist für diese Wohnung bereits belegt (manuelle Buchung oder Airbnb). Bitte Datum oder Wohnung anpassen — oder weiter unten "Belegungsprüfung ignorieren" aktivieren, falls das Angebot trotzdem erstellt werden soll.');
                    return;
                }

                const nights = calculateNights(offerForm.checkIn, offerForm.checkOut);
                const total = calculateTotal(offerForm);
                const isRealGuestId = guests.some(g => String(g.id) === String(offerForm.guestId));

                const payload = {
                    guestId: isRealGuestId ? parseInt(offerForm.guestId) : null,
                    sourceInquiryId: isRealGuestId ? null : offerForm.guestId,
                    guestName: offerForm.guestName || guest.name,
                    guestEmail: offerForm.guestEmail || guest.email,
                    guestPhone: guest.phone || '',
                    guestAddress: offerForm.guestAddress || guest.address || '',
                    wohnung: offerForm.wohnung,
                    checkIn: offerForm.checkIn,
                    checkOut: offerForm.checkOut,
                    persons: offerForm.persons,
                    earlyCheckin: offerForm.earlyCheckin,
                    lateCheckout: offerForm.lateCheckout,
                    finalCleaning: offerForm.finalCleaning,
                    dogFee: offerForm.dogFee,
                    dogCount: offerForm.dogCount,
                    projektSpace: offerForm.projektSpace,
                    projektSpaceCleaning: offerForm.projektSpaceCleaning,
                    discountPercent: offerForm.discountPercent,
                    total,
                    nights,
                };

                const resetForm = () => setOfferForm({
                    guestId: '',
                    guestName: '',
                    guestEmail: '',
                    guestAddress: '',
                    wohnung: 'wohnung1',
                    checkIn: '',
                    checkOut: '',
                    persons: 1,
                    earlyCheckin: false,
                    lateCheckout: false,
                    finalCleaning: true,
                    dogFee: false,
                    dogCount: 1,
                    projektSpace: false,
                    projektSpaceCleaning: false,
                    discountPercent: 0,
                    ignoreOccupancyCheck: false,

                        setOffers(offers.map(o => o.id === editingOfferId ? updatedOffer : o));

                        resetForm();
                        setShowOfferForm(false);

                        const created = await apiFetch('/api/offers', {
                            method: 'POST',
                            body: JSON.stringify({ ...payload, status: 'sent' }),
                        });
                        const newOffer = mapOfferFromDb(created);
                        setOffers([...offers, newOffer]);
                        resetForm();
                        setShowOfferForm(false);
                        setShowMailPreview(newOffer);
                        setOfferMailSubject(`Angebot ${offerDisplayNumber(newOffer)} - Greenhouse Market`);

                    alert('Angebot konnte nicht gespeichert werden: ' + err.message);

                    remaining: { field: 'remainingPaid', newStatus: 'completed' },
                };
                const mapping = statusMap[paymentType];
                if (!mapping) return;
                try {
                    await apiFetch(`/api/bookings/${bookingId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ [mapping.field]: true, status: mapping.newStatus }),
                    });

                        if (b.id === bookingId) {

            const sendOfferWithAttachment = async (offer, subject) => {

                // Datei-Anhang wird nicht unterstützt (z. B. Browser/App ohne Web-Share-Level-2).
                // Wir laden die PDF trotzdem herunter, damit sie in jedem Fall verfügbar ist,
                // und bieten danach zusätzlich einen reinen Text-Share an (funktioniert auf den
                // meisten Smartphones auch ohne Datei-Unterstützung, z. B. für WhatsApp/Signal).
                const url = URL.createObjectURL(blob);

                a.download = fileName;

                const mailBody = generateMailContent(offer);

                if (navigator.share) {

                alert(`„${fileName}“ wurde heruntergeladen.\n\nDein Browser/deine App kann Anhänge nicht automatisch übergeben (Sicherheitsbeschränkung). Gleich öffnet sich dein Mail-Programm vorbereitet — bitte ziehe die heruntergeladene Datei per Drag & Drop dort hinein, bevor du sendest.`);

                window.location.href = `mailto:${offer.guest.email}?subject=${encodeURIComponent(mailSubject)}&body=${encodeURIComponent(mailBody)}`;
            };

            // Öffnet die Angebots-Mail-Vorschau und setzt einen editierbaren Standard-Betreff
            // (Bug-Fix: Betreff war zuvor fest verdrahtet und nicht änderbar).
            const openOfferMailPreview = (offer) => {

            const deleteOffer = async (id) => {

            const createBlockedPeriod = async () => {

            // Hilfsfunktionen für die Kalenderansicht im "Zeitraum blockieren"-Formular
            const blockCalDs = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

            const handleBlockCalDayClick = (dateStr) => {
                if (!blockForm.checkIn || (blockForm.checkIn && blockForm.checkOut)) {

            const renderBlockCalendarMonth = () => {
                const { year, month } = blockCalMonth;
                const firstOfMonth = new Date(year, month, 1);
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                // Montag = 0 ... Sonntag = 6
                const startOffset = (firstOfMonth.getDay() + 6) % 7;
                const todayStr = blockCalDs(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
                const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

                const cells = [];
                for (let i = 0; i < startOffset; i++) {
                    cells.push(<div key={'empty-' + i} className="blockcal-tag leer"></div>);
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = blockCalDs(year, month, d);
                    const isPast = dateStr < todayStr;
                    const isOccupied = isDateBookedForWohnung(dateStr, blockForm.wohnung);
                    const isInSelection = blockForm.checkIn && dateStr >= blockForm.checkIn && (blockForm.checkOut ? dateStr < blockForm.checkOut : dateStr === blockForm.checkIn);

                    const prevDateObj = new Date(year, month, d - 1);
                    const prevDateStr = blockCalDs(prevDateObj.getFullYear(), prevDateObj.getMonth(), prevDateObj.getDate());
                    const prevOccupied = isDateBookedForWohnung(prevDateStr, blockForm.wohnung);

                    const isPreBlockEdge = blockedPeriods.some(bp => {
                        const affectsThisWohnung = bp.wohnung === blockForm.wohnung || bp.wohnung === 'both' || blockForm.wohnung === 'both';
                        return affectsThisWohnung && bp.checkIn === dateStr;
                    });
                    const isPostBlockEdge = blockedPeriods.some(bp => {
                        const affectsThisWohnung = bp.wohnung === blockForm.wohnung || bp.wohnung === 'both' || blockForm.wohnung === 'both';
                        return affectsThisWohnung && bp.checkOut === dateStr;
                    });
                    const prevIsPreBlockEdge = blockedPeriods.some(bp => {
                        const affectsThisWohnung = bp.wohnung === blockForm.wohnung || bp.wohnung === 'both' || blockForm.wohnung === 'both';
                        return affectsThisWohnung && bp.checkIn === prevDateStr;
                    });

                    // Anreisetag jeder echten Buchung: erster belegter Tag, gespiegelte Diagonale
                    // (dasselbe Prinzip wie auf der Website und im Gäste-Tool).
                    const isArrival = isOccupied && !prevOccupied && !prevIsPreBlockEdge;
                    // Abreisetag: erster freier Tag direkt nach einer belegten Nacht.
                    const isDeparture = !isOccupied && prevOccupied;

                    let cls = 'blockcal-tag';
                    if (isPast) cls += ' past';
                    else if (isOccupied) cls += (' belegt' + (isArrival ? ' halb-an' : ''));
                    else if (isInSelection) cls += ' ausgewaehlt';
                    else if (isDeparture) cls += ' halb-ab';
                    else if (isPreBlockEdge) cls += ' halb-vor';
                    else if (isPostBlockEdge) cls += ' halb-ab';
                    cells.push(
                        <div
                            key={dateStr}
                            className={cls}
                            onClick={() => { if (!isPast) handleBlockCalDayClick(dateStr); }}
                            style={{ cursor: isPast ? 'default' : 'pointer' }}
                            title={(isPreBlockEdge || isPostBlockEdge) && !isOccupied ? 'Randtag einer Blockierung — selbst noch verfügbar' : undefined}
                        >
                            {d}
                        </div>
                    );
                }

                return (
                    <div className="blockcal">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                            <button type="button" className="secondary" onClick={() => setBlockCalMonth(m => m.month === 0 ? { year: m.year - 1, month: 11 } : { year: m.year, month: m.month - 1 })}>←</button>
                            <strong>{monthNames[month]} {year}</strong>
                            <button type="button" className="secondary" onClick={() => setBlockCalMonth(m => m.month === 11 ? { year: m.year + 1, month: 0 } : { year: m.year, month: m.month + 1 })}>→</button>
                        </div>
                        <div className="blockcal-grid">
                            {['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => <div key={d} className="blockcal-weekday">{d}</div>)}
                            {cells}
                        </div>
                        <div style={{ display: 'flex', gap: '14px', marginTop: '10px', fontSize: '11px', color: 'var(--licht-70)' }}>
                            <span><span className="blockcal-legend-dot belegt"></span> Belegt/blockiert</span>
                            <span><span className="blockcal-legend-dot ausgewaehlt"></span> Ausgewählt</span>
                            <span><span className="blockcal-legend-dot halb"></span> Randtag (noch frei)</span>
                        </div>
                    </div>
                );
            };

            const wohnungLabel = (w) => w === 'wohnung1' ? 'Wohnung I' : w === 'wohnung2' ? 'Wohnung II' : 'Beide Wohnungen';

            // Preis für eine zusätzliche Person ab einem bestimmten Index. Gibt es für
            // diesen Index keine eigene Stufe mehr, gilt der zuletzt definierte Preis
            // (statt kostenlos) — verhindert, dass sehr große Gruppen unterberechnet werden.
            const getExtraPersonPrice = (index) => {
                const list = prices.extraPersonPrices || [];
                if (list.length === 0) return 0;
                if (index < list.length) return list[index] || 0;
                return list[list.length - 1] || 0;
            };

            const getBasePersons = (wohnung) => {
                if (prices.basePersons && typeof prices.basePersons === 'object') {
                    return prices.basePersons[wohnung] || 4;
                }
                // Fallback für ältere gespeicherte Daten, in denen basePersons noch eine einzelne Zahl war
                return prices.basePersons || 4;
            };

            const getFinalCleaning = (wohnung) => {
                if (prices.finalCleaning && typeof prices.finalCleaning === 'object') {
                    return prices.finalCleaning[wohnung] || 0;
                }
                // Fallback für ältere gespeicherte Daten, in denen finalCleaning noch eine einzelne Zahl war
                return prices.finalCleaning || 0;
            };

            // Verhindert Abstürze, wenn ein Datensatz (z.B. eine ältere Anfrage/Buchung
            // aus dem lokalen Speicher) ein erwartetes Zahlenfeld nicht enthält.
            const safeNum = (v) => {
                const n = typeof v === 'number' ? v : parseFloat(v);
                return isNaN(n) ? 0 : n;
            };

            // Fortlaufende, für Menschen lesbare Anzeige-Nummern (RE-2026-0001 / AN-2026-0001).
            // Die interne Datenbank-ID (offer.id / invoice.id) bleibt für API-Aufrufe,
            // React-Keys usw. unverändert erhalten — nur die ANZEIGE (Titel, PDF, Mail,
            // Verwendungszweck) verwendet diese fortlaufende Nummer, damit sie garantiert
            // bei 1 beginnt und nicht durch die rohen (teils 3- bis 9-stelligen) DB-IDs
            // "springt". Die Reihenfolge richtet sich nach der DB-ID (= Erstellungsreihenfolge).
            //
            // Zusätzlich: Jede Nummer kann manuell überschrieben werden (z. B. um eine
            // bestehende Nummernfolge fortzusetzen oder Lücken zu vermeiden). Die
            // Überschreibung wird in diesem Browser gespeichert (localStorage) — sie ist
            // also aktuell GERÄTEGEBUNDEN und wird nicht automatisch mit anderen Geräten/
            // Personen (z. B. Jan) synchronisiert. Für eine geräteübergreifende Speicherung
            // müsste das Feld im Backend (Datenbank) ergänzt werden.
            const invoiceDisplayNumber = (invoice) => {
                if (!invoice) return '';
                if (invoiceNumberOverrides[invoice.id]) return invoiceNumberOverrides[invoice.id];
                // Bevorzugt die serverseitig einmalig vergebene, dauerhafte Nummer
                // (Spalte display_number) — garantiert identisch mit PDF/DATEV-Versand.
                // Fallback (Berechnung im Browser) nur für Alt-Datensätze von vor der
                // Einführung dieser persistenten Nummer.
                if (invoice.displayNumber) return invoice.displayNumber;
                const sorted = [...invoices].sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                const idx = sorted.findIndex(i => i.id === invoice.id);
                const seq = idx >= 0 ? idx + 1 : sorted.length + 1;
                const year = invoice.invoiceDate ? new Date(invoice.invoiceDate).getFullYear() : new Date().getFullYear();
                return `RE-${year}-${String(seq).padStart(4, '0')}`;
            };

            const offerDisplayNumber = (offer) => {
                if (!offer) return '';
                if (offerNumberOverrides[offer.id]) return offerNumberOverrides[offer.id];
                if (offer.displayNumber) return offer.displayNumber;
                const sorted = [...offers].sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                const idx = sorted.findIndex(o => o.id === offer.id);
                const seq = idx >= 0 ? idx + 1 : sorted.length + 1;
                let year = new Date().getFullYear();
                if (offer.created) {
                    const parts = offer.created.split('.');
                    if (parts.length === 3 && parseInt(parts[2], 10)) year = parseInt(parts[2], 10);
                }
                return `AN-${year}-${String(seq).padStart(4, '0')}`;
            };

            const setOfferNumberOverride = (offerId, value) => {
                setOfferNumberOverrides(prev => {
                    const next = { ...prev };
                    if (value && value.trim()) {
                        next[offerId] = value.trim();
                    } else {
                        delete next[offerId];
                    }
                    localStorage.setItem('offerNumberOverrides', JSON.stringify(next));
                    return next;
                });
            };

            const setInvoiceNumberOverride = (invoiceId, value) => {

                        delete next[invoiceId];

                    localStorage.setItem('invoiceNumberOverrides', JSON.stringify(next));
                    return next;

            const calcInvoiceNet = (items) => items.reduce((sum, it) => sum + (parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0), 0);

            const computeInvoiceAmounts = (items, vatMode, discountPercent) => {
                const rawNet = calcInvoiceNet(items);
                const discount = Math.max(0, Math.min(100, parseFloat(discountPercent) || 0));
                const discountAmount = rawNet * (discount / 100);
                const net = rawNet - discountAmount;
                const vatRate = vatMode === '19' ? 0.19 : vatMode === '7' ? 0.07 : 0;
                const vatAmount = net * vatRate;
                const gross = net + vatAmount;
                return { rawNet, discount, discountAmount, net, vatRate, vatAmount, gross };
            };

            const addInvoiceItem = () => {

            const isInvoiceServiceActive = (key) => invoiceForm.items.some(it => it.key === key);

            // ---- Preisverwaltung (Grundpreise, feste & frei verwaltbare Zusatzleistungen) ----
            const updatePrice = (field, value) => setPrices({ ...prices, [field]: value });

            const addPriceOverride = () => {

            const deletePriceOverride = (id) => setPriceOverrides(priceOverrides.filter(ov => ov.id !== id));

            const addSchoolHoliday = () => {
                if (!holidayForm.startDate || !holidayForm.endDate) {

                    return;

                const newHoliday = {
                    id: 'sh-' + Date.now(),

                setHolidayForm({ startDate: '', endDate: '', label: '' });

            const deleteSchoolHoliday = (id) => setSchoolHolidays(schoolHolidays.filter(h => h.id !== id));

            const MONTH_NAMES = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

            // Erzeugt die Tageszellen für die Monatsansicht (inkl. Auffüll-Tage davor/danach).
            const getCalendarDays = (year, monthIndex) => {
                const firstOfMonth = new Date(Date.UTC(year, monthIndex, 1));
                const startWeekday = (firstOfMonth.getUTCDay() + 6) % 7; // Montag = 0
                const daysInMonth = new Date(Date.UTC(year, monthIndex + 1, 0)).getUTCDate();
                const cells = [];
                for (let i = 0; i < startWeekday; i++) cells.push(null);
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    cells.push(dateStr);
                }
                while (cells.length % 7 !== 0) cells.push(null);
                return cells;
            };



            // Export/Import der Einstellungen als JSON-Datei. Notwendig, weil Chrome
            // jeder heruntergeladenen Dateiversion einen eigenen, getrennten
            // localStorage-Speicher gibt — ohne das hier würden Preise, Kontodaten

            const exportSettings = () => {

                a.click();
                document.body.removeChild(a);

            const importSettings = (e) => {

            const getFlexiblePolicyText = () => `Stornobedingungen Greenhouse Market:
- Bis 30 Tage vor Anreise: Kostenlos stornierbar
- 15-29 Tage vor Anreise: 50% Anzahlung fällig
- Weniger als 15 Tage: 100% Stornogebühr
- Kaution: ${prices.deposit}€ (wird nach Checkout zurückerstattet)`;

- Mit Bestätigung der Buchung (Zusage der Anfrage) ist eine Stornierung nicht mehr möglich.
- Der vollständige Rechnungsbetrag ist in jedem Fall fällig, unabhängig vom Zeitpunkt einer Absage oder Nichtanreise.
- Bereits geleistete Zahlungen (Anzahlung, Restzahlung) werden nicht erstattet.
- Kaution: ${prices.deposit}€ (wird nach Checkout zurückerstattet, sofern keine Schäden vorliegen)`;

            const updateBasePersons = (wohnung, value) => {
                const current = (prices.basePersons && typeof prices.basePersons === 'object') ? prices.basePersons : {};
                setPrices({ ...prices, basePersons: { ...current, [wohnung]: value } });

            const updateFinalCleaning = (wohnung, value) => {

                setPrices({ ...prices, finalCleaning: { ...current, [wohnung]: value } });
            };

            const updateExtraPersonPrice = (idx, value) => {
                const arr = [...(prices.extraPersonPrices || [15, 15, 15, 15])];
                arr[idx] = value;
                setPrices({ ...prices, extraPersonPrices: arr });
            };

            const addExtraPersonPrice = () => {
                const arr = [...(prices.extraPersonPrices || [])];
                const lastValue = arr.length > 0 ? arr[arr.length - 1] : 15;
                arr.push(lastValue);
                setPrices({ ...prices, extraPersonPrices: arr });
            };

            const removeExtraPersonPrice = (idx) => {
                const arr = (prices.extraPersonPrices || []).filter((_, i) => i !== idx);
                setPrices({ ...prices, extraPersonPrices: arr });
            };

            const addExtraService = () => {
                setPrices({ ...prices, extraServices: [...(prices.extraServices || []), { id: Date.now(), name: '', price: 0 }] });
            };

            const updateExtraService = (id, field, value) => {
                setPrices({ ...prices, extraServices: (prices.extraServices || []).map(s => s.id === id ? { ...s, [field]: value } : s) });
            };

            const removeExtraService = (id) => {
                setPrices({ ...prices, extraServices: (prices.extraServices || []).filter(s => s.id !== id) });
            };

            // Baut eine vollständig aufgeschlüsselte Positionsliste (Unterkunft, Zusatzpersonen,
            // Zusatzleistungen) aus Aufenthalts-Parametern — statt einer einzelnen Pauschalsumme.
            const buildInvoiceItemsFromParams = (params) => {
                const wohnung = params.wohnung;
                const nights = Math.max(1, calculateNights(params.serviceStart, params.serviceEnd) || 1);

                const items = [
                    ...buildAccommodationLineItems(params.serviceStart, params.serviceEnd, wohnung),
                ];

                const basePersonsForWohnung = getBasePersons(wohnung);
                const persons = parseInt(params.persons) || basePersonsForWohnung;
                if (persons > basePersonsForWohnung) {
                    for (let i = basePersonsForWohnung; i < persons; i++) {
                        const extraPersonIndex = i - basePersonsForWohnung;
                        const personPrice = getExtraPersonPrice(extraPersonIndex);
                        items.push({ key: 'person-' + i, description: `Zusatzperson ${i + 1} (${nights} Nächte)`, quantity: nights, unitPrice: personPrice });
                    }
                }

                if (params.earlyCheckin) items.push({ key: 'earlyCheckin', description: 'Early Check-in', quantity: 1, unitPrice: prices.earlyCheckin });
                if (params.lateCheckout) items.push({ key: 'lateCheckout', description: 'Late Checkout', quantity: 1, unitPrice: prices.lateCheckout });
                if (params.finalCleaning) items.push({ key: 'finalCleaning', description: 'Endreinigung', quantity: 1, unitPrice: getFinalCleaning(wohnung) });
                if (params.dogFee) items.push({ key: 'dogFee', description: 'Hundegebühr (pro Hund × Nacht)', quantity: (parseInt(params.dogCount) || 1) * nights, unitPrice: prices.dogFee });
                if (params.projektSpace) {
                    items.push({ key: 'projektSpace', description: 'Projektraum-Nutzung (pro Nacht)', quantity: nights, unitPrice: prices.projektSpace });
                    items.push({ key: 'projektSpaceCleaning', description: 'Projektraum Reinigung', quantity: 1, unitPrice: prices.projektSpaceCleaning });
                }

                return items;
            };

            // Erstellt (öffnet den vorausgefüllten Rechnungsentwurf für) eine Rechnung, die
            // NUR die Anzahlung oder NUR den Restbetrag einer Buchung abdeckt — statt wie
            // bisher immer den vollen Aufenthaltspreis aufzuschlüsseln. Nützlich, weil Gäste
            // im Angebot bisher nur zur Anzahlung aufgefordert wurden und der Restbetrag
            // separat in Rechnung gestellt werden muss, sobald er fällig ist.
            const applyBookingLegToInvoice = (bookingId, leg) => {
                const booking = bookings.find(b => b.id === bookingId);
                if (!booking) return;
                const isDownpayment = leg === 'downpayment';
                const amount = isDownpayment ? safeNum(booking.downPayment) : safeNum(booking.remaining);
                const description = isDownpayment
                    ? `Anzahlung für Aufenthalt ${booking.checkIn} bis ${booking.checkOut}`
                    : `Restzahlung für Aufenthalt ${booking.checkIn} bis ${booking.checkOut}`;

                setInvoiceForm({
                    ...emptyInvoiceForm,
                    sourceRef: `booking:${booking.id}`,
                    wohnung: booking.wohnung,
                    guestName: booking.guest.name,
                    guestEmail: booking.guest.email,
                    guestAddress: booking.guest.address || '',
                    serviceStart: booking.checkIn,
                    serviceEnd: booking.checkOut,
                    items: [{ description, quantity: 1, unitPrice: amount }],
                });
                setActiveTab('invoices');
                setShowInvoiceForm(true);
            };

            const applySourceToInvoice = (value) => {
                if (!value) {
                    setInvoiceForm({ ...emptyInvoiceForm, items: [{ description: '', quantity: 1, unitPrice: 0 }] });
                    return;
                }
                const [type, id] = value.split(':');

                if (type === 'booking') {
                    const booking = bookings.find(b => b.id === id);
                    if (!booking) return;
                    const params = {
                        wohnung: booking.wohnung,
                        serviceStart: booking.checkIn,
                        serviceEnd: booking.checkOut,
                        persons: booking.persons,
                        earlyCheckin: booking.earlyCheckin,
                        lateCheckout: booking.lateCheckout,
                        finalCleaning: booking.finalCleaning,
                        dogFee: booking.dogFee,
                        dogCount: booking.dogCount,
                        projektSpace: booking.projektSpace,
                    };
                    setInvoiceForm({
                        ...invoiceForm,
                        sourceRef: value,
                        wohnung: booking.wohnung,
                        guestName: booking.guest.name,
                        guestEmail: booking.guest.email,
                        guestAddress: booking.guest.address || invoiceForm.guestAddress,
                        serviceStart: booking.checkIn,
                        serviceEnd: booking.checkOut,
                        persons: booking.persons || 1,
                        earlyCheckin: !!booking.earlyCheckin,
                        lateCheckout: !!booking.lateCheckout,
                        finalCleaning: !!booking.finalCleaning,
                        dogFee: !!booking.dogFee,
                        dogCount: booking.dogCount || 1,
                        projektSpace: !!booking.projektSpace,
                        items: buildInvoiceItemsFromParams(params),
                    });
                } else if (type === 'inquiry') {
                    const inquiry = inquiries.find(i => i.id === id);
                    if (!inquiry) return;
                    const params = {
                        wohnung: inquiry.wohnung,
                        serviceStart: inquiry.checkIn,
                        serviceEnd: inquiry.checkOut,
                        persons: inquiry.persons,
                        earlyCheckin: inquiry.earlyCheckin,
                        lateCheckout: inquiry.lateCheckout,
                        finalCleaning: inquiry.finalCleaning,
                        dogFee: inquiry.dogFee,
                        dogCount: inquiry.dogCount,
                        projektSpace: inquiry.projektSpace,
                    };
                    setInvoiceForm({
                        ...invoiceForm,
                        sourceRef: value,
                        wohnung: inquiry.wohnung,
                        guestName: inquiry.name,
                        guestEmail: inquiry.email,
                        guestAddress: inquiry.address || invoiceForm.guestAddress,
                        serviceStart: inquiry.checkIn,
                        serviceEnd: inquiry.checkOut,
                        persons: inquiry.persons || 1,
                        earlyCheckin: !!inquiry.earlyCheckin,
                        lateCheckout: !!inquiry.lateCheckout,
                        finalCleaning: !!inquiry.finalCleaning,
                        dogFee: !!inquiry.dogFee,
                        dogCount: inquiry.dogCount || 1,
                        projektSpace: !!inquiry.projektSpace,
                        items: buildInvoiceItemsFromParams(params),
                    });
                } else if (type === 'offer') {
                    const offer = offers.find(o => String(o.id) === id);
                    if (!offer) return;
                    const params = {
                        wohnung: offer.wohnung,
                        serviceStart: offer.checkIn,
                        serviceEnd: offer.checkOut,
                        persons: offer.persons,
                        earlyCheckin: offer.earlyCheckin,
                        lateCheckout: offer.lateCheckout,
                        finalCleaning: offer.finalCleaning,
                        dogFee: offer.dogFee,
                        dogCount: offer.dogCount,
                        projektSpace: offer.projektSpace,
                    };
                    setInvoiceForm({
                        ...invoiceForm,
                        sourceRef: value,
                        wohnung: offer.wohnung,
                        guestName: offer.guest.name,
                        guestEmail: offer.guest.email,
                        guestAddress: offer.guest.address || invoiceForm.guestAddress,
                        serviceStart: offer.checkIn,
                        serviceEnd: offer.checkOut,
                        persons: offer.persons || 1,
                        earlyCheckin: !!offer.earlyCheckin,
                        lateCheckout: !!offer.lateCheckout,
                        finalCleaning: !!offer.finalCleaning,
                        dogFee: !!offer.dogFee,
                        dogCount: offer.dogCount || 1,
                        projektSpace: !!offer.projektSpace,
                        discountPercent: offer.discountPercent || 0,
                        items: buildInvoiceItemsFromParams(params),
                    });
                } else if (type === 'guest') {
                    const guest = guests.find(g => String(g.id) === id);
                    if (!guest) return;
                    setInvoiceForm({
                        ...invoiceForm,
                        sourceRef: value,
                        guestName: guest.name,
                        guestEmail: guest.email,
                        guestAddress: guest.address || invoiceForm.guestAddress,
                    });
                }
            };

            const createInvoice = async () => {
                if (!invoiceForm.guestName || !invoiceForm.guestEmail || !invoiceForm.guestAddress || invoiceForm.items.length === 0) return;
                const { rawNet, discount, discountAmount, net, vatRate, vatAmount, gross } = computeInvoiceAmounts(invoiceForm.items, invoiceForm.vatMode, invoiceForm.discountPercent);

                const payload = {
                    ...invoiceForm,
                    rawNet,
                    discountAmount,
                    net,
                    vatRate,
                    vatAmount,
                    gross,
                };

                try {
                    if (editingInvoiceId) {
                        const updated = await apiFetch(`/api/invoices/${editingInvoiceId}`, {
                            method: 'PUT',
                            body: JSON.stringify(payload),
                        });
                        const updatedInvoice = mapInvoiceFromDb(updated);
                        setInvoices(invoices.map(i => i.id === editingInvoiceId ? updatedInvoice : i));
                        setEditingInvoiceId(null);
                        setInvoiceForm({ ...emptyInvoiceForm, items: [{ description: '', quantity: 1, unitPrice: 0 }] });
                        setShowInvoiceForm(false);
                        setShowInvoiceMailPreview(updatedInvoice);
                        setInvoiceMailSubject(`Rechnung ${invoiceDisplayNumber(updatedInvoice)} - Greenhouse Market`);
                    } else {
                        const created = await apiFetch('/api/invoices', {
                            method: 'POST',
                            body: JSON.stringify(payload),
                        });
                        const newInvoice = mapInvoiceFromDb(created);
                        setInvoices([...invoices, newInvoice]);
                        setInvoiceForm({ ...emptyInvoiceForm, items: [{ description: '', quantity: 1, unitPrice: 0 }] });
                        setShowInvoiceForm(false);
                        setShowInvoiceMailPreview(newInvoice);
                        setInvoiceMailSubject(`Rechnung ${invoiceDisplayNumber(newInvoice)} - Greenhouse Market`);
                    }
                } catch (err) {
                    alert('Rechnung konnte nicht gespeichert werden: ' + err.message);
                }
            };

            const deleteInvoice = async (id) => {
                try {
                    await apiFetch(`/api/invoices/${id}`, { method: 'DELETE' });
                    setInvoices(invoices.filter(i => i.id !== id));
                } catch (err) {
                    alert('Rechnung konnte nicht gelöscht werden: ' + err.message);
                }
            };

            const sendInvoiceToDatev = async (invoice) => {
                const label = invoiceDisplayNumber(invoice);
                if (!confirm(`Rechnung ${label} jetzt manuell per E-Mail an DATEV senden?`)) return;
                try {
                    await apiFetch(`/api/datev/send-invoice/${invoice.id}`, { method: 'POST' });
                    setInvoices(invoices.map(i => i.id === invoice.id ? { ...i, datevSentAt: new Date().toISOString() } : i));
                    alert(`Rechnung ${label} wurde an DATEV gesendet.`);
                } catch (err) {
                    alert('Versand an DATEV fehlgeschlagen: ' + err.message);
                }
            };

            const markInvoicePaid = async (id) => {
                try {
                    await apiFetch(`/api/invoices/${id}`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: 'paid' }),
                    });
                    setInvoices(invoices.map(i => i.id === id ? { ...i, status: 'paid' } : i));
                } catch (err) {
                    alert('Status konnte nicht aktualisiert werden: ' + err.message);
                }
            };

            const generateInvoiceMailContent = (invoice) => {
                let content = `Liebe/r ${invoice.guestName},

anbei erhalten Sie die Rechnung für Ihren Aufenthalt im Greenhouse.

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
RECHNUNG ${invoiceDisplayNumber(invoice)}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Rechnungsdatum: ${new Date(invoice.invoiceDate).toLocaleDateString('de-DE')}
`;
                if (invoice.serviceStart && invoice.serviceEnd) {
                    content += `Leistungszeitraum: ${invoice.serviceStart} bis ${invoice.serviceEnd}\n`;
                }
                content += `
Rechnungsempfänger:
${invoice.guestName}
`;
                if (invoice.guestAddress) content += `${invoice.guestAddress}\n`;
                content += `${invoice.guestEmail}

LEISTUNGEN
`;
                invoice.items.forEach(it => {
                    const qty = parseFloat(it.quantity) || 0;
                    const price = parseFloat(it.unitPrice) || 0;
                    content += `${it.description} — ${qty} × ${price.toFixed(2)}€ = ${(qty * price).toFixed(2)}€\n`;
                });

                content += `\nZwischensumme: ${safeNum(invoice.rawNet ?? invoice.net).toFixed(2)}€\n`;
                if (invoice.discount > 0) {
                    content += `Rabatt (${invoice.discount}%): -${safeNum(invoice.discountAmount).toFixed(2)}€\n`;
                }
                content += `Nettobetrag: ${invoice.net.toFixed(2)}€\n`;
                if (invoice.vatMode === 'kleinunternehmer') {
                    content += `Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.\n`;
                } else {
                    content += `zzgl. ${(invoice.vatRate * 100).toFixed(0)}% USt: ${invoice.vatAmount.toFixed(2)}€\n`;
                }
                content += `GESAMTBETRAG: ${invoice.gross.toFixed(2)}€

${companyInfo.bic ? `BIC: ${companyInfo.bic}` : 'BIC: [Ihr BIC hier eintragen]'}
Verwendungszweck: ${invoiceDisplayNumber(invoice)}
`;
                if (invoice.notes) content += `\n${invoice.notes}\n`;
                content += `
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
STORNOBEDINGUNGEN (zur Erinnerung — bereits bei Ihrer Buchungsanfrage akzeptiert)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${cancellationPolicy}

Aktuelle Kaution: ${prices.deposit}€ (wird nach Checkout zurückerstattet, sofern keine Schäden vorliegen)

Viele Grüße,
Lucia & Jan

Brandenburger Straße 17
16798 Fürstenberg/Havel
Deutschland
`;
                if (companyInfo.taxId) content += `\nUSt-IdNr.: ${companyInfo.taxId}`;
                if (companyInfo.registerNr) content += ` · Unternehmensregisternr.: ${companyInfo.registerNr}`;

                return content;
            };

            // Baut ein echtes PDF-Dokument (jsPDF) im Briefkopf-Design der Firma.

                    if (y + needed > pageHeight - 25) {
                        doc.addPage();
                        y = 20;

                // Briefkopf: Logo + Adresse

                doc.line(marginLeft, y, pageWidth - marginRight, y);

                y += 12;

                // Empfänger links, Meta rechts

                doc.setFontSize(10);
                doc.text('Rechnungsempfänger:', marginLeft, y);
                doc.setFont('helvetica', 'normal');
                // Feste Spaltenbreite für den Empfänger, damit lange Namen/Adressen
                // automatisch umgebrochen werden statt in die rechte Meta-Spalte
                // (Rechnungsdatum/Leistungszeitraum) hineinzulaufen.
                const recipientMaxWidth = contentWidth * 0.55;
                let recipientY = y + 5;
                const nameLines = doc.splitTextToSize(invoice.guestName || '', recipientMaxWidth);
                doc.text(nameLines, marginLeft, recipientY);
                recipientY += nameLines.length * 5;
                (invoice.guestAddress || '').split('\n').forEach(line => {
                    if (!line) return;
                    const addrLines = doc.splitTextToSize(line, recipientMaxWidth);
                    doc.text(addrLines, marginLeft, recipientY);
                    recipientY += addrLines.length * 5;
                });
                const emailLines = doc.splitTextToSize(invoice.guestEmail || '', recipientMaxWidth);
                doc.text(emailLines, marginLeft, recipientY);
                recipientY += emailLines.length * 5;

                doc.setFontSize(9);
                let metaY = y;
                doc.text(`Rechnungsdatum: ${new Date(invoice.invoiceDate).toLocaleDateString('de-DE')}`, pageWidth - marginRight, metaY, { align: 'right' });
                metaY += 5;
                if (invoice.serviceStart && invoice.serviceEnd) {
                    doc.text(`Leistungszeitraum: ${invoice.serviceStart} – ${invoice.serviceEnd}`, pageWidth - marginRight, metaY, { align: 'right' });
                    metaY += 5;
                }
                doc.text('Zahlungsziel: 14 Tage netto', pageWidth - marginRight, metaY, { align: 'right' });

                y = Math.max(recipientY, metaY) + 10;

                // Tabellenkopf
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(9);
                const colDesc = marginLeft;
                const colQty = marginLeft + contentWidth * 0.55;
                const colPrice = marginLeft + contentWidth * 0.70;
                const colTotal = pageWidth - marginRight;
                doc.text('Beschreibung', colDesc, y);
                doc.text('Menge', colQty, y, { align: 'right' });
                doc.text('Einzelpreis', colPrice, y, { align: 'right' });
                doc.text('Gesamt', colTotal, y, { align: 'right' });
                y += 2;
                doc.setLineWidth(0.3);
                doc.line(marginLeft, y, pageWidth - marginRight, y);
                y += 6;

                doc.setFont('helvetica', 'normal');
                invoice.items.forEach(it => {
                    const qty = parseFloat(it.quantity) || 0;
                    const price = parseFloat(it.unitPrice) || 0;
                    const lineTotal = qty * price;
                    const descLines = doc.splitTextToSize(it.description || '', contentWidth * 0.5);
                    ensureSpace(Math.max(6, descLines.length * 5));
                    doc.text(descLines, colDesc, y);
                    doc.text(String(qty), colQty, y, { align: 'right' });
                    doc.text(price.toFixed(2) + ' €', colPrice, y, { align: 'right' });
                    doc.text(lineTotal.toFixed(2) + ' €', colTotal, y, { align: 'right' });

                y += 7;

                if (invoice.discount > 0) {
                    doc.text('Zwischensumme', colPrice, y, { align: 'right' });

                    doc.text(`Rabatt (${invoice.discount}%)`, colPrice, y, { align: 'right' });

                y += 8;

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(12);

                y += 12;

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(9);
                if (invoice.notes) {
                    ensureSpace(20);
                    const noteLines = doc.splitTextToSize(invoice.notes, contentWidth);
                    doc.text(noteLines, marginLeft, y);
                    y += noteLines.length * 5 + 4;
                }

                ensureSpace(40);
                const paymentIntroLines = doc.splitTextToSize(
                    'Bitte überweisen Sie den Betrag innerhalb von 14 Tagen ohne Abzug auf folgendes Konto (spätestens jedoch mit dem Anreisetag fällig):',

                doc.text(companyInfo.bic ? `BIC: ${companyInfo.bic}` : 'BIC: [bitte in den Einstellungen eintragen]', marginLeft, y);

                doc.text(`Verwendungszweck: ${invoiceDisplayNr}`, marginLeft, y);
