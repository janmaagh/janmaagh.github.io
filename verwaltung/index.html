                                        </select>
                                    </div>

                                    <div className="form-group">
                                        <label>Wohnung</label>
                                        <select value={invoiceForm.wohnung} onChange={(e) => setInvoiceForm({ ...invoiceForm, wohnung: e.target.value })}>
                                            <option value="wohnung1">Wohnung I</option>
                                            <option value="wohnung2">Wohnung II</option>
                                            <option value="both">Beide Wohnungen</option>
                                        </select>
                                        <div style={{ fontSize: '11px', color: 'var(--licht-70)', marginTop: '4px' }}>
                                            Bestimmt die wohnungsspezifischen Preise (z. B. Endreinigung) bei den Zusatzleistungen unten.
                                        </div>
                                    </div>

                                    <div className="grid">
                                        <div className="form-group">
                                            <label>Name des Gastes *</label>
                                            <input type="text" value={invoiceForm.guestName} onChange={(e) => setInvoiceForm({ ...invoiceForm, guestName: e.target.value })} />
                                        </div>
                                        <div className="form-group">
                                            <label>E-Mail *</label>
                                            <input type="email" value={invoiceForm.guestEmail} onChange={(e) => setInvoiceForm({ ...invoiceForm, guestEmail: e.target.value })} />
                                        </div>
                                        <div className="form-group" style={{ gridColumn: '1/-1' }}>
                                            <label>Adresse des Gastes *</label>
                                            <textarea rows={2} value={invoiceForm.guestAddress} onChange={(e) => setInvoiceForm({ ...invoiceForm, guestAddress: e.target.value })} placeholder={"Straße Nr.\nPLZ Ort"}></textarea>
                                            <div style={{ fontSize: '11px', color: 'var(--licht-70)', marginTop: '4px' }}>
                                                Pflichtangabe nach § 14 Abs. 4 Nr. 1 UStG, damit die Rechnung rechtsgültig ist.
                                            </div>
                                        </div>
                                        <div className="form-group">
                                            <label>Rechnungsdatum</label>
                                            <input type="date" value={invoiceForm.invoiceDate} onChange={(e) => setInvoiceForm({ ...invoiceForm, invoiceDate: e.target.value })} />
                                        </div>
                                        <div className="form-group">
                                            <label>Leistungszeitraum Beginn</label>
                                            <input type="date" value={invoiceForm.serviceStart} onChange={(e) => setInvoiceForm({ ...invoiceForm, serviceStart: e.target.value })} />
                                        </div>
                                        <div className="form-group">
                                            <label>Leistungszeitraum Ende</label>
                                            <input type="date" value={invoiceForm.serviceEnd} onChange={(e) => setInvoiceForm({ ...invoiceForm, serviceEnd: e.target.value })} />
                                        </div>
                                    </div>


                                    <h4 style={{ marginTop: '20px', marginBottom: '10px' }}>Aufenthalts-Parameter (aus Anfrage/Buchung übernommen, hier änderbar)</h4>
                                    <p style={{ fontSize: '12px', color: 'var(--licht-70)', marginTop: 0 }}>
                                        Passe bei Bedarf Personenzahl oder Zusatzleistungen an und klicke danach auf "Positionen neu berechnen" —
                                        das ersetzt die Liste unten mit einer aktuellen, aufgeschlüsselten Berechnung (inkl. Zusatzpersonen).
                                    </p>
                                    <div className="grid">
                                        <div className="form-group">
                                            <label>Personenzahl</label>
                                            <input type="number" min="1" max="20" value={invoiceForm.persons} onChange={(e) => { const v = parseInt(e.target.value); setInvoiceForm({ ...invoiceForm, persons: isNaN(v) ? '' : v }); }} onBlur={() => { if (!invoiceForm.persons) setInvoiceForm({ ...invoiceForm, persons: 1 }); }} />
                                        </div>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="param-earlyCheckin" checked={invoiceForm.earlyCheckin} onChange={(e) => setInvoiceForm({ ...invoiceForm, earlyCheckin: e.target.checked })} />
                                        <label htmlFor="param-earlyCheckin" style={{ margin: 0 }}>Early Check-in (+{prices.earlyCheckin}€)</label>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="param-lateCheckout" checked={invoiceForm.lateCheckout} onChange={(e) => setInvoiceForm({ ...invoiceForm, lateCheckout: e.target.checked })} />
                                        <label htmlFor="param-lateCheckout" style={{ margin: 0 }}>Late Checkout (+{prices.lateCheckout}€)</label>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="param-finalCleaning" checked={invoiceForm.finalCleaning} onChange={(e) => setInvoiceForm({ ...invoiceForm, finalCleaning: e.target.checked })} />
                                        <label htmlFor="param-finalCleaning" style={{ margin: 0 }}>Endreinigung (+{getFinalCleaning(invoiceForm.wohnung)}€)</label>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="param-dogFee" checked={invoiceForm.dogFee} onChange={(e) => setInvoiceForm({ ...invoiceForm, dogFee: e.target.checked })} />
                                        <label htmlFor="param-dogFee" style={{ margin: 0 }}>Hundegebühr (+{prices.dogFee}€/Hund/Nacht)</label>
                                    </div>
                                    {invoiceForm.dogFee && (
                                        <div className="form-group" style={{ marginLeft: '24px' }}>
                                            <label>Anzahl Hunde</label>
                                            <input type="number" min="1" max="5" value={invoiceForm.dogCount} onChange={(e) => setInvoiceForm({ ...invoiceForm, dogCount: parseInt(e.target.value) || 1 })} />
                                        </div>
                                    )}
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="param-projektSpace" checked={invoiceForm.projektSpace} onChange={(e) => setInvoiceForm({ ...invoiceForm, projektSpace: e.target.checked })} />
                                        <label htmlFor="param-projektSpace" style={{ margin: 0 }}>Projektraum (+{prices.projektSpace}€/Nacht + {prices.projektSpaceCleaning}€ Reinigung)</label>
                                    </div>

                                    <button
                                        type="button"
                                        className="secondary"
                                        style={{ marginTop: '12px', marginBottom: '8px' }}
                                        disabled={!invoiceForm.serviceStart || !invoiceForm.serviceEnd}
                                        onClick={() => setInvoiceForm({ ...invoiceForm, items: buildInvoiceItemsFromParams(invoiceForm) })}
                                    >
                                        🔄 Positionen aus diesen Angaben neu berechnen
                                    </button>
                                    {(!invoiceForm.serviceStart || !invoiceForm.serviceEnd) && (
                                        <div style={{ fontSize: '11px', color: 'var(--licht-70)', marginBottom: '8px' }}>
                                            Bitte zuerst Leistungszeitraum (Beginn/Ende) angeben.
                                        </div>
                                    )}

                                    <h4 style={{ marginTop: '20px', marginBottom: '12px' }}>Positionen</h4>
                                    {invoiceForm.items.map((it, idx) => (
                                        <div key={idx} style={{ display: 'grid', gridTemplateColumns: '3fr 1fr 1fr auto', gap: '8px', marginBottom: '8px', alignItems: 'end' }}>
                                            <div className="form-group" style={{ margin: 0 }}>
                                                <label>Beschreibung</label>
                                                <input type="text" value={it.description} onChange={(e) => updateInvoiceItem(idx, 'description', e.target.value)} placeholder="z. B. Unterkunft Wohnung I (3 Nächte)" />
                                            </div>
                                            <div className="form-group" style={{ margin: 0 }}>
                                                <label>Menge</label>
                                                <input type="number" min="0" step="1" value={it.quantity} onChange={(e) => updateInvoiceItem(idx, 'quantity', parseFloat(e.target.value) || 0)} />
                                            </div>
                                            <div className="form-group" style={{ margin: 0 }}>
                                                <label>Einzelpreis (€)</label>
                                                <input type="number" min="0" step="0.01" value={it.unitPrice} onChange={(e) => updateInvoiceItem(idx, 'unitPrice', parseFloat(e.target.value) || 0)} />
                                            </div>
                                            <button type="button" className="danger" onClick={() => removeInvoiceItem(idx)} disabled={invoiceForm.items.length === 1}>✕</button>
                                        </div>
                                    ))}
                                    <button type="button" className="secondary" onClick={addInvoiceItem} style={{ marginBottom: '20px' }}>+ Position hinzufügen</button>

                                    <h4 style={{ marginTop: '20px', marginBottom: '12px' }}>Zusatzleistungen</h4>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="inv-earlyCheckin" checked={isInvoiceServiceActive('earlyCheckin')} onChange={() => toggleInvoiceService('earlyCheckin', 'Early Check-in', prices.earlyCheckin)} />
                                        <label htmlFor="inv-earlyCheckin" style={{ margin: 0 }}>Early Check-in (+{prices.earlyCheckin}€)</label>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="inv-lateCheckout" checked={isInvoiceServiceActive('lateCheckout')} onChange={() => toggleInvoiceService('lateCheckout', 'Late Checkout', prices.lateCheckout)} />
                                        <label htmlFor="inv-lateCheckout" style={{ margin: 0 }}>Late Checkout (+{prices.lateCheckout}€)</label>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="inv-finalCleaning" checked={isInvoiceServiceActive('finalCleaning')} onChange={() => toggleInvoiceService('finalCleaning', 'Endreinigung', getFinalCleaning(invoiceForm.wohnung))} />
                                        <label htmlFor="inv-finalCleaning" style={{ margin: 0 }}>Endreinigung (+{getFinalCleaning(invoiceForm.wohnung)}€)</label>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="inv-dogFee" checked={isInvoiceServiceActive('dogFee')} onChange={() => toggleInvoiceService('dogFee', 'Hundegebühr (pro Hund × Nacht)', prices.dogFee, invoiceNightsCount())} />
                                        <label htmlFor="inv-dogFee" style={{ margin: 0 }}>Hundegebühr (+{prices.dogFee}€/Hund/Nacht — Menge danach bei Bedarf anpassen)</label>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="inv-projektSpace" checked={isInvoiceServiceActive('projektSpace')} onChange={() => toggleInvoiceService('projektSpace', 'Projektraum-Nutzung (pro Nacht)', prices.projektSpace, invoiceNightsCount())} />
                                        <label htmlFor="inv-projektSpace" style={{ margin: 0 }}>Projektraum (+{prices.projektSpace}€/Nacht — Menge danach bei Bedarf anpassen)</label>
                                    </div>
                                    <div className="checkbox-group">
                                        <input type="checkbox" id="inv-projektSpaceCleaning" checked={isInvoiceServiceActive('projektSpaceCleaning')} onChange={() => toggleInvoiceService('projektSpaceCleaning', 'Projektraum Reinigung', prices.projektSpaceCleaning)} />
                                        <label htmlFor="inv-projektSpaceCleaning" style={{ margin: 0 }}>Projektraum Reinigung (+{prices.projektSpaceCleaning}€)</label>
                                    </div>

                                        <React.Fragment>
                                            <h4 style={{ marginTop: '16px', marginBottom: '12px' }}>Weitere Leistungen</h4>

                                                <div className="checkbox-group" key={service.id}>
                                                    <input type="checkbox" id={'inv-svc-' + service.id} checked={isInvoiceServiceActive('svc-' + service.id)} onChange={() => toggleInvoiceService('svc-' + service.id, service.name || 'Zusatzleistung', service.price)} />
                                                    <label htmlFor={'inv-svc-' + service.id} style={{ margin: 0 }}>{service.name || 'Zusatzleistung'} (+{service.price}€)</label>
                                                </div>
                                            ))}
                                        </React.Fragment>
                                    )}

                                    <div className="form-group">
                                        <label>Umsatzsteuer</label>
                                        <select value={invoiceForm.vatMode} onChange={(e) => setInvoiceForm({ ...invoiceForm, vatMode: e.target.value })}>
                                            <option value="kleinunternehmer">Keine USt (§ 19 UStG Kleinunternehmerregelung)</option>
                                            <option value="7">7% USt (ermäßigt, Beherbergung)</option>
                                            <option value="19">19% USt (regulär)</option>
                                        </select>
                                    </div>

                                    <div className="form-group">
                                        <label>Rabatt (%)</label>
                                        <input type="number" min="0" max="100" step="1" value={invoiceForm.discountPercent} onChange={(e) => { const v = parseFloat(e.target.value); setInvoiceForm({ ...invoiceForm, discountPercent: isNaN(v) ? 0 : Math.max(0, Math.min(100, v)) }); }} placeholder="0" />
                                        <div style={{ fontSize: '11px', color: 'var(--licht-70)', marginTop: '4px' }}>
                                            Wird auf den Nettobetrag angewendet, bevor die Umsatzsteuer berechnet wird.
                                        </div>
                                    </div>

                                    <div className="form-group">
                                        <label>Anmerkung (optional, erscheint auf der Rechnung)</label>
                                        <textarea rows={2} value={invoiceForm.notes} onChange={(e) => setInvoiceForm({ ...invoiceForm, notes: e.target.value })}></textarea>
                                    </div>

                                    <div className="offer-summary">
                                        {(() => {
                                            const amounts = computeInvoiceAmounts(invoiceForm.items, invoiceForm.vatMode, invoiceForm.discountPercent);
                                            return (
                                                <React.Fragment>
                                                    <div className="offer-row"><span>Zwischensumme:</span><span>{amounts.rawNet.toFixed(2)}€</span></div>
                                                    {amounts.discount > 0 && (
                                                        <div className="offer-row"><span>Rabatt ({amounts.discount}%):</span><span>-{amounts.discountAmount.toFixed(2)}€</span></div>
                                                    )}
                                                    <div className="offer-row"><span>Nettobetrag:</span><span>{amounts.net.toFixed(2)}€</span></div>
                                                    {invoiceForm.vatMode !== 'kleinunternehmer' && (
                                                        <div className="offer-row"><span>USt ({(amounts.vatRate * 100).toFixed(0)}%):</span><span>{amounts.vatAmount.toFixed(2)}€</span></div>
                                                    )}
                                                    <div className="offer-total">Gesamtbetrag: {amounts.gross.toFixed(2)}€</div>
                                                </React.Fragment>
                                            );
                                        })()}
                                    </div>

                                    <button
                                        onClick={createInvoice}
                                        disabled={!invoiceForm.guestName || !invoiceForm.guestEmail || !invoiceForm.guestAddress || invoiceForm.items.every(it => !it.description)}
                                        style={{ width: '100%' }}
                                    >
                                        {editingInvoiceId ? 'Änderungen speichern & E-Mail-Vorschau' : 'Rechnung erstellen & E-Mail-Vorschau'}
                                    </button>
                                </div>
                            )}

                            <div>
                                {invoices.slice().reverse().map(invoice => (
                                    <div key={invoice.id} className="item-card">
                                        <div className="item-header">
                                            <div>
                                                <div className="item-title" style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                                    <input
                                                        type="text"
                                                        defaultValue={invoiceDisplayNumber(invoice)}
                                                        key={invoice.id + ':' + (invoiceNumberOverrides[invoice.id] || '')}
                                                        onBlur={(e) => {
                                                            const auto = (() => {
                                                                const sorted = [...invoices].sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                                                                const idx = sorted.findIndex(i => i.id === invoice.id);
                                                                const seq = idx >= 0 ? idx + 1 : sorted.length + 1;
                                                                const year = invoice.invoiceDate ? new Date(invoice.invoiceDate).getFullYear() : new Date().getFullYear();
                                                                return `RE-${year}-${String(seq).padStart(4, '0')}`;
                                                            })();
                                                            setInvoiceNumberOverride(invoice.id, e.target.value === auto ? '' : e.target.value);
                                                        }}
                                                        style={{ fontSize: '16px', fontWeight: '600', border: '1px dashed var(--licht-40, #999)', borderRadius: '4px', background: 'rgba(255,255,255,0.05)', padding: '3px 6px', width: '160px', color: invoiceNumberOverrides[invoice.id] ? 'var(--accent)' : 'inherit', cursor: 'text' }}
                                                        title="Klicken zum Bearbeiten der Rechnungsnummer"
                                                    />
                                                    <span style={{ fontSize: '11px', color: 'var(--licht-70)' }}>✏️</span>
                                                    {invoiceNumberOverrides[invoice.id] && (
                                                        <button className="secondary" style={{ padding: '2px 6px', fontSize: '11px' }} onClick={() => setInvoiceNumberOverride(invoice.id, '')} title="Auf automatische Nummer zurücksetzen">↺</button>
                                                    )}
                                                </div>
                                                <div className="item-meta">{invoice.guestName} • {invoice.created}</div>
                                            </div>
                                            <div style={{ textAlign: 'right' }}>
                                                <div style={{ fontSize: '18px', fontWeight: '600', color: 'var(--accent)', marginBottom: '4px' }}>{invoice.gross.toFixed(2)}€</div>
                                                <div className={invoice.status === 'paid' ? 'status-paid' : 'status-pending'}>
                                                    {invoice.status === 'paid' ? '✓ Bezahlt' : '⏳ Offen'}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="item-meta">
                                            {invoice.serviceStart && invoice.serviceEnd ? `${invoice.serviceStart} bis ${invoice.serviceEnd} • ` : ''}
                                            {invoice.vatMode === 'kleinunternehmer' ? 'Ohne USt (§19)' : `${(invoice.vatRate * 100).toFixed(0)}% USt`}
                                        </div>
                                        <div className="button-group" style={{ marginTop: '12px' }}>
                                            <button className="secondary" onClick={() => openInvoiceMailPreview(invoice)}>📧 Mail anzeigen</button>
                                            <button className="secondary" onClick={() => printInvoice(invoice)}>🖨️ Drucken / PDF</button>
                                            <button onClick={() => sendInvoiceWithAttachment(invoice)}>📎 PDF an Mail anhängen &amp; senden</button>
                                            <button className="secondary" onClick={() => startEditInvoice(invoice)}>✏️ Bearbeiten</button>
                                            {invoice.status !== 'paid' && (
                                                <button className="success" onClick={() => markInvoicePaid(invoice.id)}>✓ Als bezahlt markieren</button>
                                            )}
                                            <button
                                                className="secondary"
                                                onClick={() => sendInvoiceToDatev(invoice)}
                                                title={invoice.datevSentAt ? `Bereits am ${new Date(invoice.datevSentAt).toLocaleString('de-DE')} an DATEV gesendet — erneut senden?` : 'Manuell an DATEV senden'}
                                                style={invoice.datevSentAt ? { opacity: 0.7 } : {}}
                                            >
                                                {invoice.datevSentAt ? '📤 Erneut an DATEV senden' : '📤 An DATEV senden'}
                                            </button>
                                            <button className="danger" onClick={() => deleteInvoice(invoice.id)}>Löschen</button>
                                        </div>
                                    </div>
                                ))}
                                {invoices.length === 0 && <p style={{ color: 'var(--licht-70)', textAlign: 'center', padding: '40px 0' }}>Noch keine Rechnungen</p>}
                            </div>
                        </div>
                    )}

                    {/* POSTAUSGANG (DATEV + Begrüßungsmails) */}
                    {activeTab === 'postausgang' && (() => {
                        const datevEvents = [];
                        const welcomeEvents = [];
                        const invoiceById = {};
                        for (const inv of invoices) invoiceById[inv.id] = inv;
                        for (const b of bookings) {
                            if (b.datevDownpaymentSentAt) {
                                const linkedInvoice = b.downPaymentInvoiceId ? invoiceById[b.downPaymentInvoiceId] : null;
                                datevEvents.push({
                                    bookingId: b.id, guestName: b.guest.name, leg: 'Anzahlung',
                                    amount: b.downPayment, sentAt: b.datevDownpaymentSentAt,
                                    invoiceId: linkedInvoice ? invoiceDisplayNumber(linkedInvoice) : b.downPaymentInvoiceId,
                                    checkIn: b.checkIn, checkOut: b.checkOut,
                                });
                            }
                            if (b.datevRemainingSentAt) {
                                const linkedInvoice = b.remainingInvoiceId ? invoiceById[b.remainingInvoiceId] : null;
                                datevEvents.push({
                                    bookingId: b.id, guestName: b.guest.name, leg: 'Restzahlung',
                                    amount: b.remaining, sentAt: b.datevRemainingSentAt,
                                    invoiceId: linkedInvoice ? invoiceDisplayNumber(linkedInvoice) : b.remainingInvoiceId,
                                    checkIn: b.checkIn, checkOut: b.checkOut,
                                });
                            }
                            if (b.welcomeEmailSentAt) {
                                welcomeEvents.push({
                                    bookingId: b.id, guestName: b.guest.name, guestEmail: b.guest.email,
                                    sentAt: b.welcomeEmailSentAt, checkIn: b.checkIn, checkOut: b.checkOut,
                                });
                            }
                        }
                        datevEvents.sort((a, c) => new Date(c.sentAt) - new Date(a.sentAt));
                        welcomeEvents.sort((a, c) => new Date(c.sentAt) - new Date(a.sentAt));
                        const manualDatevInvoices = invoices
                            .filter(inv => inv.datevSentAt)
                            .slice()
                            .sort((a, c) => new Date(c.datevSentAt) - new Date(a.datevSentAt));
                        const fmt = (iso) => new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                        return (
                            <div>
                                <div className="card">
                                    <h2 style={{ marginTop: 0 }}>📤 An DATEV gesendet</h2>
                                    <p style={{ fontSize: '13px', color: 'var(--licht-70)' }}>
                                        Übersicht aller automatisch an DATEV übermittelten Anzahlungs-/Restzahlungs-Rechnungen, zur Kontrolle.
                                    </p>
                                    {datevEvents.length === 0 && (
                                        <p style={{ color: 'var(--licht-70)', textAlign: 'center', padding: '30px 0' }}>Noch nichts an DATEV gesendet</p>
                                    )}
                                    {datevEvents.map((ev, i) => (
                                        <div key={i} className="list-item" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid var(--rahmen, #333)', padding: '10px 0' }}>
                                            <div>
                                                <div style={{ fontWeight: 600 }}>{ev.guestName} — {ev.leg}{ev.invoiceId ? ` (${ev.invoiceId})` : ''}</div>
                                                <div style={{ fontSize: '12px', color: 'var(--licht-70)' }}>
                                                    Buchung {ev.bookingId} · Aufenthalt {ev.checkIn} bis {ev.checkOut} · {Number(ev.amount).toFixed(2)} €
                                                </div>
                                            </div>
                                            <div style={{ fontSize: '13px', textAlign: 'right', whiteSpace: 'nowrap' }}>

                            <div className="card">
                                <h3>💾 Datensicherung</h3>
                                <p style={{ fontSize: '12px', color: 'var(--licht-70)', marginTop: 0 }}>
                                    Alle Daten (Gäste, Anfragen, Angebote, Buchungen, Rechnungen, Einstellungen) liegen in der Cloudflare-Datenbank.
                                    Zusätzlich läuft jede Woche automatisch eine Server-Sicherung — hier kannst du jederzeit auch selbst eine
                                    Kopie herunterladen, z. B. um sie sicher auf deinem eigenen Rechner abzulegen.
                                </p>

                                {daysSinceLastBackup() === null && (
                                    <div style={{ color: '#e0a05a', fontSize: '13px', marginBottom: '12px' }}>
                                        ⚠ Du hast noch nie ein manuelles Backup heruntergeladen.
                                    </div>
                                )}
                                {daysSinceLastBackup() !== null && daysSinceLastBackup() > 14 && (
                                    <div style={{ color: '#e0a05a', fontSize: '13px', marginBottom: '12px' }}>
                                        ⚠ Dein letztes manuelles Backup ist {daysSinceLastBackup()} Tage her — vielleicht mal wieder Zeit dafür?
                                    </div>
                                )}
                                {daysSinceLastBackup() !== null && daysSinceLastBackup() <= 14 && (
                                    <div style={{ color: 'var(--licht-70)', fontSize: '13px', marginBottom: '12px' }}>
                                        Letztes manuelles Backup: vor {daysSinceLastBackup()} {daysSinceLastBackup() === 1 ? 'Tag' : 'Tagen'}
                                    </div>
                                )}

                                <button onClick={downloadBackupNow}>📥 Backup jetzt herunterladen</button>
                                {backupMessage && <div style={{ fontSize: '13px', color: 'var(--licht-70)', marginTop: '8px' }}>{backupMessage}</div>}

                                <h4 style={{ marginTop: '24px', marginBottom: '12px' }}>Automatische Server-Backups (letzte Wochen)</h4>
                                {loadingBackups && <p style={{ fontSize: '13px', color: 'var(--licht-70)' }}>Lade …</p>}
                                {!loadingBackups && serverBackups.length === 0 && (
                                    <p style={{ fontSize: '13px', color: 'var(--licht-70)' }}>Noch keine automatischen Backups vorhanden — die ersten entstehen mit dem nächsten wöchentlichen Lauf.</p>
                                )}
                                {!loadingBackups && serverBackups.map(b => (
                                    <div key={b.id} className="item-card" style={{ padding: '10px 14px', marginBottom: '8px' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                            <span style={{ fontSize: '13px' }}>{new Date(b.created_at).toLocaleString('de-DE')}</span>
                                            <button className="secondary" onClick={() => downloadServerBackup(b.id, b.created_at)}>📥 Herunterladen</button>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="card">
                                <h3>Firmendaten</h3>
                                <div className="grid">
                                    <div className="form-group">
                                        <label>Kontakt E-Mail</label>
                                        <input type="email" value={companyInfo.email} onChange={(e) => setCompanyInfo({ ...companyInfo, email: e.target.value })} placeholder="info@greenhouse-fuerstenberg.de" />
                                    </div>
                                    <div className="form-group">
                                        <label>IBAN</label>
                                        <input type="text" value={companyInfo.iban} onChange={(e) => setCompanyInfo({ ...companyInfo, iban: e.target.value })} placeholder="DE89 3704 0044 0532 0130 00" />
                                    </div>
                                    <div className="form-group">
                                        <label>BIC</label>
                                        <input type="text" value={companyInfo.bic} onChange={(e) => setCompanyInfo({ ...companyInfo, bic: e.target.value })} placeholder="COBADEFFXXX" />
                                    </div>
                                    <div className="form-group">
                                        <label>USt-IdNr.</label>
                                        <input type="text" value={companyInfo.taxId} onChange={(e) => setCompanyInfo({ ...companyInfo, taxId: e.target.value })} placeholder="DE123456789" />
                                    </div>
                                    <div className="form-group">
                                        <label>Unternehmensregisternummer</label>
                                        <input type="text" value={companyInfo.registerNr} onChange={(e) => setCompanyInfo({ ...companyInfo, registerNr: e.target.value })} placeholder="053/154/01420" />
                                    </div>
                                </div>

                                <h3>WLAN-Zugangsdaten (für automatische Begrüßungsmail)</h3>
                                <div className="grid">
                                    <div className="form-group">
                                        <label>Netzwerkname (SSID)</label>
                                        <input type="text" value={wifiInfo.name} onChange={(e) => setWifiInfo({ ...wifiInfo, name: e.target.value })} placeholder="GREENHOUSE" />
                                    </div>
                                    <div className="form-group">
                                        <label>Passwort</label>
                                        <div style={{ display: 'flex', gap: '6px' }}>
                                            <input
                                                type={showWifiPassword ? 'text' : 'password'}
                                                value={wifiInfo.password}
                                                onChange={(e) => setWifiInfo({ ...wifiInfo, password: e.target.value })}
                                                placeholder="•••••••••"
                                                style={{ flex: 1 }}
                                            />
                                            <button type="button" className="secondary" onClick={() => setShowWifiPassword(!showWifiPassword)} title={showWifiPassword ? 'Passwort verbergen' : 'Passwort anzeigen'}>
                                                {showWifiPassword ? '🙈' : '👁️'}
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <h3>Begrüßungsmail-Text (automatisch, 5 Tage vor Anreise)</h3>
                                <p style={{ fontSize: '12px', color: 'var(--licht-70)', marginTop: '-8px' }}>
                                    Verfügbare Platzhalter (werden automatisch pro Buchung ersetzt): {'{{vorname}}'}, {'{{datum}}'}, {'{{adresse}}'}, {'{{wlan_name}}'}, {'{{wlan_passwort}}'}
                                </p>
                                <div className="form-group">
                                    <textarea
                                        rows={14}
                                        value={welcomeEmailTemplate}
                                        onChange={(e) => setWelcomeEmailTemplate(e.target.value)}
                                        style={{ fontFamily: 'monospace', fontSize: '13px' }}
                                    />
                                </div>
                                <button type="button" className="secondary" onClick={() => setWelcomeEmailTemplate(DEFAULT_WELCOME_EMAIL_TEMPLATE)}>
                                    ↺ Auf Standardtext zurücksetzen
                                </button>

                                <h3>DATEV-Upload-Adresse</h3>
                                <p style={{ fontSize: '12px', color: 'var(--licht-70)', marginTop: '-8px' }}>
                                    Ziel-E-Mail-Adresse für automatische und manuelle DATEV-Übermittlungen. Nur ändern, falls DATEV euch eine neue Adresse zuweist.
                                </p>
                                <div className="form-group">
                                    <input type="email" value={datevEmail} onChange={(e) => setDatevEmail(e.target.value)} placeholder="xxxxxxxx@uploadmail.datev.de" />
                                </div>
                            </div>
                        </div>
                    )}

                    </ErrorBoundary>

                    {/* MAIL PREVIEW MODAL */}
                    {showMailPreview && (
                        <div className="modal-overlay" onClick={() => setShowMailPreview(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <h2 style={{ marginTop: 0 }}>Angebot {offerDisplayNumber(showMailPreview)} an {showMailPreview.guest.name}</h2>
                                <p style={{ fontSize: '12px', color: 'var(--licht-70)' }}>Kopiere diese Mail und versende sie per E-Mail-Client, oder öffne das druckbare Angebot mit Briefkopf als PDF-Anhang.</p>

                                <div className="form-group">
                                    <label>Betreff</label>
                                    <input type="text" value={offerMailSubject} onChange={(e) => setOfferMailSubject(e.target.value)} />
                                </div>

                                <div className="mail-preview">
                                    {generateMailContent(showMailPreview)}
                                </div>

                                <div className="button-group">
                                    <button className="secondary" onClick={() => copyToClipboard(generateMailContent(showMailPreview))}>📋 Kopieren</button>
                                    <button className="secondary" onClick={() => printOffer(showMailPreview)}>🖨️ Ansehen / Drucken</button>
                                    <button onClick={() => sendOfferWithAttachment(showMailPreview, offerMailSubject)}>📎 PDF an Mail anhängen &amp; senden</button>
                                    <button className="secondary" onClick={() => window.location.href = `mailto:${showMailPreview.guest.email}?subject=${encodeURIComponent(offerMailSubject)}&body=${encodeURIComponent(generateMailContent(showMailPreview))}`}>✉️ Nur Mail öffnen</button>
                                    <button className="secondary" onClick={() => setShowMailPreview(null)}>✕</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* RECHNUNGS-MAIL PREVIEW MODAL */}
                    {showInvoiceMailPreview && (
                        <div className="modal-overlay" onClick={() => setShowInvoiceMailPreview(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <h2 style={{ marginTop: 0 }}>Rechnung {invoiceDisplayNumber(showInvoiceMailPreview)} an {showInvoiceMailPreview.guestName}</h2>
                                <p style={{ fontSize: '12px', color: 'var(--licht-70)' }}>Kopiere den Text und versende ihn per E-Mail-Client, oder öffne die druckbare Rechnung mit Briefkopf als PDF-Anhang.</p>

                                <div className="form-group">
                                    <label>Betreff</label>
                                    <input type="text" value={invoiceMailSubject} onChange={(e) => setInvoiceMailSubject(e.target.value)} />
                                </div>

                                <div className="mail-preview">
                                    {generateInvoiceMailContent(showInvoiceMailPreview)}
                                </div>

                                <div className="button-group">
                                    <button className="secondary" onClick={() => copyToClipboard(generateInvoiceMailContent(showInvoiceMailPreview))}>📋 Kopieren</button>
                                    <button className="secondary" onClick={() => printInvoice(showInvoiceMailPreview)}>🖨️ Ansehen / Drucken</button>
                                    <button onClick={() => sendInvoiceWithAttachment(showInvoiceMailPreview, invoiceMailSubject)}>📎 PDF an Mail anhängen &amp; senden</button>
                                    <button className="secondary" onClick={() => window.location.href = `mailto:${showInvoiceMailPreview.guestEmail}?subject=${encodeURIComponent(invoiceMailSubject)}&body=${encodeURIComponent(generateInvoiceMailContent(showInvoiceMailPreview))}`}>✉️ Nur Mail öffnen</button>
                                    <button className="secondary" onClick={() => setShowInvoiceMailPreview(null)}>✕</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
