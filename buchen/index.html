<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo-png-optimized.png">
    <title>Greenhouse – Gäste-Anfrage (öffentlich · /buchen)</title>
    <!--
      ═══════════════════════════════════════════════════════════════
      GÄSTE-TOOL — öffentliches Anfrageformular für Gäste
      Wird deployt unter: greenhouse-fuerstenberg.de/buchen
      Kein Login, für jeden erreichbar.
      ═══════════════════════════════════════════════════════════════
    -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --nachtblau:   #0d1a2a;
            --tintenblau:  #1a2d3d;
            --schiefblau:  #223344;
            --rauchgruen:  #1a2e22;
            --moosgruen:   #2a4030;
            --waldgruen:   #344d3a;
            --ocker-dunkel:#3d2e14;
            --bernstein:   #5a4020;
            --staub:       #3a3530;
            
            --licht:       #e8e0d0;
            --licht-70:    rgba(232,224,208,.72);
            --licht-40:    rgba(232,224,208,.42);
            --licht-15:    rgba(232,224,208,.16);
            --licht-08:    rgba(232,224,208,.08);
            
            --accent:      #c8a43a;
            --prism-gelb:  rgba(180,140,40,.55);
            --prism-blau:  rgba(60,100,160,.45);
            --prism-gruen: rgba(60,120,80,.40);
            
            --s1:  .5rem;   --s2:.8rem;    --s3:1.375rem;
            --s5:  1.625rem; --s8:2.625rem; --s13:4.25rem;
            --s21: 6.875rem; --s34:11.125rem;
            
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Jost', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--nachtblau);
            color: var(--licht);
            font-family: var(--font-sans);
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-serif);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        h1 { font-size: 32px; }
        h2 { font-size: 24px; }
        h3 { font-size: 20px; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            background: linear-gradient(135deg, var(--tintenblau) 0%, var(--nachtblau) 100%);
            border-bottom: 1px solid var(--licht-08);
            padding: 30px 0;
            margin-bottom: 40px;
        }

        header .container {
            padding: 30px 20px;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--licht);
            display: flex;
            align-items: center;
            gap: var(--s3);
        }

        .tagline {
            font-size: 14px;
            color: var(--licht-70);
        }

        .card {
            background: var(--tintenblau);
            border: 1px solid var(--licht-08);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--licht);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--licht-08);
            border-radius: 6px;
            font-size: 14px;
            font-family: var(--font-sans);
            background-color: var(--nachtblau);
            color: var(--licht);
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 164, 58, 0.15);
        }

        button {
            background: var(--accent);
            color: var(--licht);
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-sans);
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            background: var(--accent);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .calendar {
            background: var(--nachtblau);
            border: 1px solid var(--licht-08);
            border-radius: 6px;
            padding: 16px;
            margin-top: 8px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-header button {
            background: none;
            border: 1px solid var(--licht-08);
            color: var(--licht);
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
        }

        .calendar-header h4 {
            margin: 0;
            font-size: 14px;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .calendar-weekday {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--licht-70);
            padding: 4px;
            text-transform: uppercase;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--licht-08);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            background: var(--tintenblau);
        }

        .calendar-day:hover:not(.disabled):not(.other-month) {
            border-color: var(--accent);
            background: rgba(200, 164, 58, 0.15);
        }

        .calendar-day.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--tintenblau);
            font-weight: 600;
        }

        .calendar-day.in-range {
            background: rgba(139, 115, 85, 0.2);
            border-color: var(--accent);
        }

        .calendar-day.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .calendar-day.belegt {
            background: rgba(180,70,55,.4);
            color: rgba(232,224,208,.6);
            border-color: rgba(180,70,55,.5);
            opacity: 1;
        }
        .calendar-day.belegt.halb-an {
            background: linear-gradient(135deg, transparent 50%, rgba(180,70,55,.4) 50%);
            color: var(--licht-70);
        }
        .calendar-day.halb-ab {
            background: linear-gradient(135deg, rgba(180,70,55,.32) 50%, transparent 50%);
        }
        .calendar-day.halb-vor {
            background: linear-gradient(135deg, transparent 50%, rgba(180,70,55,.32) 50%);
        }
        .calendar-day.belegt.selected,
        .calendar-day.halb-an.selected,
        .calendar-day.halb-ab.selected,
        .calendar-day.halb-vor.selected {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
            font-weight: 600;
        }

        .calendar-day.other-month {
            color: #666;
            cursor: default;
        }

        .price-summary {
            background: rgba(200, 164, 58, 0.15);
            border: 1px solid var(--licht-08);
            border-radius: 6px;
            padding: 16px;
            margin-top: 20px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .price-row.total {
            border-top: 1px solid var(--licht-08);
            padding-top: 8px;
            margin-top: 8px;
            font-weight: 600;
            font-size: 16px;
            color: var(--accent);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .success-message {
            background: rgba(107, 144, 128, 0.2);
            border: 1px solid var(--rauchgruen);
            color: var(--rauchgruen);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .error-message {
            background: rgba(168, 87, 87, 0.2);
            border: 1px solid var(--bernstein);
            color: #ff6b6b;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .availability-info {
            font-size: 12px;
            color: var(--licht-70);
            margin-top: 8px;
            display: flex;
            gap: 16px;
        }

        .availability-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .availability-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .available {
            background: var(--rauchgruen);
        }

        .booked {
            background: var(--bernstein);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid var(--licht-08);
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 16px;
            }

            h1 {
                font-size: 24px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .availability-info {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Stornobedingungen — muss inhaltlich mit den Airbnb-Inseraten und der
        // Stornobedingungen-Einstellung im internen Booking System übereinstimmen.
        // Änderungen hier NICHT vergessen auch dort zu pflegen (zwei getrennte,
        // statische Dateien ohne gemeinsame Datenquelle). Die Kaution wird automatisch
        // aus den aktuell geladenen Preisen (prices.deposit) eingesetzt.
        const getStornoText = (deposit) => `Stornobedingungen Greenhouse Market (streng):
- Mit Bestätigung der Buchung (Zusage der Anfrage) ist eine Stornierung nicht mehr möglich.
- Der vollständige Rechnungsbetrag ist in jedem Fall fällig, unabhängig vom Zeitpunkt einer Absage oder Nichtanreise.
- Bereits geleistete Zahlungen (Anzahlung, Restzahlung) werden nicht erstattet.
- Kaution: ${deposit}€ (wird nach Checkout zurückerstattet, sofern keine Schäden vorliegen)`;

        function BookingForm() {
            const ICAL_PROXY_BASE = 'https://greenhouse-fuerstenberg.de/ical?url=';
            const API_BASE = 'https://greenhouse-fuerstenberg.de';
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                phone: '',
                street: '',
                houseNumber: '',
                zip: '',
                city: '',
                wohnung: 'wohnung1',
                checkIn: '',
                checkOut: '',
                persons: 1,
                earlyCheckin: false,
                lateCheckout: false,
                finalCleaning: true,
                dogFee: false,
                dogCount: 1,
                projektSpace: false,
                paymentMethod: 'bank_transfer',
                policyAccepted: false,
            });

            const [prices, setPrices] = useState({
                wohnung1: 80,
                wohnung2: 65,
                both: 140,
                basePersons: { wohnung1: 4, wohnung2: 4, both: 4 },
                extraPersonPrices: [15, 15, 15, 15],
                earlyCheckin: 20,
                lateCheckout: 15,
                finalCleaning: { wohnung1: 60, wohnung2: 60, both: 60 },
                dogFee: 15,
                projektSpace: 100,
                projektSpaceCleaning: 40,
                deposit: 100,
                extraServices: [],
            });
            const [priceOverrides, setPriceOverrides] = useState([]);
            const [liveCancellationPolicy, setLiveCancellationPolicy] = useState(null);

            const [bookings, setBookings] = useState([]);
            const [ownBooked, setOwnBooked] = useState({ wohnung1: new Set(), wohnung2: new Set(), both: new Set() });
            const [blockedEdges, setBlockedEdges] = useState({ wohnung1: new Set(), wohnung2: new Set(), both: new Set() });

            // WICHTIG: date.toISOString() rechnet in UTC um — bei einem lokal um Mitternacht
            // erzeugten Date-Objekt (new Date(jahr, monat, tag)) verschiebt das in Zeitzonen
            // östlich von UTC (z.B. deutsche Sommerzeit) das Datum um einen Tag nach vorne.
            // Diese Funktion liest Jahr/Monat/Tag stattdessen direkt lokal aus, ohne Umweg
            // über UTC, und ist deshalb sicher für alle Kalender-Datum-Vergleiche.
            function localDateStr(d) {
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            function parseIcal(text) {
                const tage = new Set();
                const lines = text.replace(/\r/g, '').split('\n');
                let inEvent = false, dtstart = null, dtend = null;
                lines.forEach((line) => {
                    if (line === 'BEGIN:VEVENT') { inEvent = true; dtstart = null; dtend = null; }
                    else if (line === 'END:VEVENT') {
                        if (inEvent && dtstart && dtend) {
                            const d = new Date(dtstart);
                            while (d < dtend) {
                                tage.add(d.toISOString().slice(0, 10));
                                d.setDate(d.getDate() + 1);
                            }
                        }
                        inEvent = false;
                    } else if (inEvent) {
                        let m;
                        if ((m = line.match(/^DTSTART(?:;[^:]*)?:([0-9]{8})/))) {
                            const v = m[1];
                            dtstart = new Date(v.slice(0, 4) + '-' + v.slice(4, 6) + '-' + v.slice(6, 8));
                        }
                        if ((m = line.match(/^DTEND(?:;[^:]*)?:([0-9]{8})/))) {
                            const v = m[1];
                            dtend = new Date(v.slice(0, 4) + '-' + v.slice(4, 6) + '-' + v.slice(6, 8));
                        }
                    }
                });
                return tage;
            }
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [submitted, setSubmitted] = useState(false);
            const [error, setError] = useState('');
            const [airbnbBooked, setAirbnbBooked] = useState({ wohnung1: new Set(), wohnung2: new Set(), both: new Set() });
            const [airbnbSyncStatus, setAirbnbSyncStatus] = useState('loading'); // 'loading' | 'ok' | 'error'

            // Buchungen und Blockierungen kommen jetzt live aus der Datenbank statt
            // aus dem längst veralteten lokalen Speicher.
            useEffect(() => {
                const wohnungen = ['wohnung1', 'wohnung2', 'both'];

                const ownBookingsPromise = Promise.all(wohnungen.map(w =>
                    fetch(`${API_BASE}/export.ics?wohnung=${w}&includeBlocks=false`)
                        .then(r => r.ok ? r.text() : '')
                        .then(text => text.indexOf('BEGIN:VCALENDAR') !== -1 ? parseIcal(text) : new Set())
                        .catch(() => new Set())
                ));

                const blockedPromise = Promise.all(wohnungen.map(w =>
                    fetch(`${API_BASE}/api/public-blocked-edges?wohnung=${w}`)
                        .then(r => r.ok ? r.json() : [])
                        .then(list => {
                            const edges = new Set();
                            const occupied = new Set();
                            (list || []).forEach(bp => {
                                edges.add(bp.checkIn);
                                edges.add(bp.checkOut);
                                let cur = new Date(bp.checkIn + 'T00:00:00Z');
                                const end = new Date(bp.checkOut + 'T00:00:00Z');
                                cur.setUTCDate(cur.getUTCDate() + 1);
                                while (cur < end) {
                                    occupied.add(cur.toISOString().split('T')[0]);
                                    cur.setUTCDate(cur.getUTCDate() + 1);
                                }
                            });
                            return { edges, occupied };
                        })
                        .catch(() => ({ edges: new Set(), occupied: new Set() }))
                ));

                Promise.all([ownBookingsPromise, blockedPromise]).then(([bookedSets, blockedResults]) => {
                    setOwnBooked({
                        wohnung1: new Set([...bookedSets[0], ...blockedResults[0].occupied]),
                        wohnung2: new Set([...bookedSets[1], ...blockedResults[1].occupied]),
                        both: new Set([...bookedSets[2], ...blockedResults[2].occupied]),
                    });
                    setBlockedEdges({
                        wohnung1: blockedResults[0].edges,
                        wohnung2: blockedResults[1].edges,
                        both: blockedResults[2].edges,
                    });
                });

                const savedBookings = localStorage.getItem('greenhouse_bookings');
                if (savedBookings) {
                    try {
                        setBookings(JSON.parse(savedBookings));
                    } catch (e) {
                        console.log('Could not load bookings');
                    }
                }

                // Preise, Stornobedingungen und Anzahlungs-% kommen jetzt live aus der
                // Datenbank (öffentlicher, nicht-passwortgeschützter Endpunkt) statt aus
                // dem längst veralteten lokalen Speicher.
                fetch(`${API_BASE}/api/public-settings`, { cache: 'no-store' })
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (!data) return;
                        if (data.prices) {
                            const parsedPrices = data.prices;
                            const migratedBasePersons = (parsedPrices.basePersons && typeof parsedPrices.basePersons === 'object')
                                ? parsedPrices.basePersons
                                : (typeof parsedPrices.basePersons === 'number'
                                    ? { wohnung1: parsedPrices.basePersons, wohnung2: parsedPrices.basePersons, both: parsedPrices.basePersons }
                                    : { wohnung1: 4, wohnung2: 4, both: 4 });
                            const migratedFinalCleaning = (parsedPrices.finalCleaning && typeof parsedPrices.finalCleaning === 'object')
                                ? parsedPrices.finalCleaning
                                : (typeof parsedPrices.finalCleaning === 'number'
                                    ? { wohnung1: parsedPrices.finalCleaning, wohnung2: parsedPrices.finalCleaning, both: parsedPrices.finalCleaning }
                                    : { wohnung1: 60, wohnung2: 60, both: 60 });
                            setPrices(prev => ({
                                ...prev,
                                ...parsedPrices,
                                basePersons: migratedBasePersons,
                                finalCleaning: migratedFinalCleaning,
                                extraPersonPrices: (Array.isArray(parsedPrices.extraPersonPrices) && parsedPrices.extraPersonPrices.length > 0)
                                    ? parsedPrices.extraPersonPrices
                                    : prev.extraPersonPrices,
                                projektSpaceCleaning: typeof parsedPrices.projektSpaceCleaning === 'number' ? parsedPrices.projektSpaceCleaning : 40,
                            }));
                        }
                        if (data.cancellationPolicy) {
                            setLiveCancellationPolicy(data.cancellationPolicy);
                        }
                        if (Array.isArray(data.priceOverrides)) {
                            setPriceOverrides(data.priceOverrides);
                        }
                    })
                    .catch(err => console.warn('Preise/Stornobedingungen konnten nicht live geladen werden, benutze Standardwerte:', err));
            }, []);

            // Airbnb-Belegung live synchronisieren (über den Cloudflare-Proxy /ical der Website)
            useEffect(() => {

                const ICAL_MAP = {
                    wohnung1: 'https://www.airbnb.de/calendar/ical/50569643.ics?t=55654c77686d4a008d0b3e157bc9fc5e',
                    wohnung2: 'https://www.airbnb.de/calendar/ical/1638991508992594489.ics?t=77ed71be4f204892ab116d8ac12bc2c1',
                    both: 'https://www.airbnb.de/calendar/ical/1645697917802366310.ics?t=8a02f4a2fb38428d8dcdc2d39612ae43',
                };

                async function loadAll() {
                    const entries = Object.entries(ICAL_MAP);
                    const results = {};
                    let anyOk = false;
                    await Promise.all(entries.map(async ([key, url]) => {
                        try {
                            const res = await fetch(ICAL_PROXY_BASE + encodeURIComponent(url));
                            if (!res.ok) throw new Error('status ' + res.status);
                            const text = await res.text();
                            if (text.indexOf('BEGIN:VCALENDAR') === -1) throw new Error('not ical');
                            results[key] = parseIcal(text);
                            anyOk = true;
                        } catch (e) {
                            console.warn('Airbnb-Sync fehlgeschlagen für', key, e);
                            results[key] = new Set();
                        }
                    }));
                    setAirbnbBooked(results);
                    setAirbnbSyncStatus(anyOk ? 'ok' : 'error');
                }

                loadAll();
            }, []);

            const calculateNights = (checkIn, checkOut) => {
                if (!checkIn || !checkOut) return 0;
                const start = new Date(checkIn);
                const end = new Date(checkOut);
                return Math.ceil((end - start) / (1000 * 60 * 60 * 24));
            };

            const addDaysToDateStr = (dateStr, days) => {
                const d = new Date(dateStr + 'T00:00:00Z');
                d.setUTCDate(d.getUTCDate() + days);
                return d.toISOString().split('T')[0];
            };

            // Ermittelt den Preis für EINE konkrete Nacht — spiegelt exakt die Logik aus
            // dem Admin-Tool (Preiszeitraum > Wochenende Fr–So > regulärer Preis), damit
            // Gäste hier denselben Betrag sehen wie im späteren Angebot.
            const getWeekendPriceFor = (dateStr, wohnung) => {
                const period = (prices.weekendPricePeriods || []).find(p => dateStr >= p.startDate && dateStr <= p.endDate);
                if (period && period[wohnung]) return period[wohnung];
                const weekendKey = wohnung === 'wohnung1' ? 'weekendWohnung1' : wohnung === 'wohnung2' ? 'weekendWohnung2' : 'weekendBoth';
                return prices[weekendKey] || null;
            };

            // Findet einen passenden individuellen Preiszeitraum — spiegelt exakt die
            // Logik aus dem Admin-Tool.
            const findOverrideForNight = (dateStr, wohnung, requireWeekendOnly) => {
                const candidates = priceOverrides.filter(ov =>
                    dateStr >= ov.startDate && dateStr <= ov.endDate &&
                    (ov.wohnung === wohnung || ov.wohnung === 'all') &&
                    (requireWeekendOnly ? !!ov.weekendOnly : !ov.weekendOnly)
                );
                if (candidates.length === 0) return null;
                const exactWohnung = candidates.filter(c => c.wohnung === wohnung);
                return (exactWohnung.length > 0 ? exactWohnung : candidates)[0];
            };

            // Wochenend-Regeln haben an Fr/Sa-Nächten IMMER Vorrang vor einem
            // allgemeinen Sondertarif — spiegelt exakt die Logik aus dem Admin-Tool.
            const nightlyBasePrice = (dateStr, wohnung) => {
                const day = new Date(dateStr + 'T00:00:00Z').getUTCDay(); // 0=So,...,5=Fr,6=Sa
                const isWeekend = (day === 5 || day === 6); // Nacht Fr->Sa und Nacht Sa->So

                if (isWeekend) {
                    const weekendOverride = findOverrideForNight(dateStr, wohnung, true);
                    if (weekendOverride) return weekendOverride.pricePerNight;

                    const weekendPrice = getWeekendPriceFor(dateStr, wohnung);
                    if (weekendPrice) return weekendPrice;
                }

                const generalOverride = findOverrideForNight(dateStr, wohnung, false);
                if (generalOverride) return generalOverride.pricePerNight;

                return prices[wohnung] || 0;
            };

            const calculateStayBasePrice = (checkIn, checkOut, wohnung) => {
                if (!checkIn || !checkOut) return 0;
                let total = 0;
                let cur = checkIn;
                while (cur < checkOut) {
                    total += nightlyBasePrice(cur, wohnung);
                    cur = addDaysToDateStr(cur, 1);
                }
                return total;
            };

            const getBasePersons = (wohnung) => {
                if (prices.basePersons && typeof prices.basePersons === 'object') {
                    return prices.basePersons[wohnung] || 4;
                }
                return prices.basePersons || 4;
            };

            const getFinalCleaning = (wohnung) => {
                if (prices.finalCleaning && typeof prices.finalCleaning === 'object') {
                    return prices.finalCleaning[wohnung] || 0;
                }
                return prices.finalCleaning || 0;
            };

            const getExtraPersonPrice = (index) => {
                const list = prices.extraPersonPrices || [];
                if (list.length === 0) return 0;
                if (index < list.length) return list[index] || 0;
                return list[list.length - 1] || 0;
            };

            const calculateTotal = () => {
                if (!formData.checkIn || !formData.checkOut) return 0;
                const nights = calculateNights(formData.checkIn, formData.checkOut);

                let total = calculateStayBasePrice(formData.checkIn, formData.checkOut, formData.wohnung);

                const basePersonsForWohnung = getBasePersons(formData.wohnung);
                if (formData.persons > basePersonsForWohnung) {
                    for (let i = basePersonsForWohnung; i < formData.persons; i++) {
                        const extraPersonIndex = i - basePersonsForWohnung;
                        const personPrice = getExtraPersonPrice(extraPersonIndex);
                        total += personPrice * nights;
                    }
                }

                if (formData.earlyCheckin) total += prices.earlyCheckin;
                if (formData.lateCheckout) total += prices.lateCheckout;
                if (formData.finalCleaning) total += getFinalCleaning(formData.wohnung);
                if (formData.dogFee) total += prices.dogFee * formData.dogCount * nights;
                if (formData.projektSpace) total += prices.projektSpace * nights + (prices.projektSpaceCleaning || 0);

                return total;
            };

            const isDateBooked = (date) => {
                const dateStr = localDateStr(date);

                // 1. Eigene Buchungen/Blockierungen live aus der Datenbank
                const ownSet = ownBooked[formData.wohnung];
                if (ownSet && ownSet.has(dateStr)) return true;

                // 2. Live von Airbnb synchronisierte Belegung für die gewählte Einheit
                const airbnbSet = airbnbBooked[formData.wohnung];
                if (airbnbSet && airbnbSet.has(dateStr)) return true;

                return false;
            };

            const isDateInRange = (date) => {
                if (!formData.checkIn || !formData.checkOut) return false;
                const current = new Date(localDateStr(date));
                const checkIn = new Date(formData.checkIn);
                const checkOut = new Date(formData.checkOut);
                return current > checkIn && current < checkOut;
            };

            const renderCalendar = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = (firstDay.getDay() + 6) % 7; // 0=Mo,...,6=So (passend zur Kopfzeile Mo-So)

                const days = [];
                for (let i = 0; i < startingDayOfWeek; i++) {
                    days.push(null);
                }
                for (let i = 1; i <= daysInMonth; i++) {
                    days.push(new Date(year, month, i));
                }

                return days;
            };

            const hasBookedDateInRange = (start, end) => {
                const d = new Date(start + 'T00:00:00');
                const endDate = new Date(end + 'T00:00:00');
                while (d < endDate) {
                    if (isDateBooked(new Date(d))) return localDateStr(d);
                    d.setDate(d.getDate() + 1);
                }
                return null;
            };

            const handleDateClick = (date) => {
                const dateStr = localDateStr(date);

                const isBookedNow = isDateBooked(date);
                if (isBookedNow) {
                    // Ausnahme: Wenn wir gerade das Abreisedatum wählen (Anreise ist schon
                    // gesetzt) und dieser Tag NUR belegt ist, weil dort eine ANDERE Buchung
                    // beginnt (Anreisetag), darf trotzdem fortgefahren werden — der eigene
                    // Aufenthalt endet dann exklusiv genau an diesem Tag (Zimmerwechsel am
                    // selben Tag ist ausdrücklich erwünscht).
                    const prevDate = new Date(date);
                    prevDate.setDate(prevDate.getDate() - 1);
                    const isOthersArrivalDay = !isDateBooked(prevDate);
                    const selectingCheckout = formData.checkIn && !formData.checkOut;
                    if (!(selectingCheckout && isOthersArrivalDay && dateStr > formData.checkIn)) {
                        return;
                    }
                }

                if (!formData.checkIn) {
                    setFormData({ ...formData, checkIn: dateStr, checkOut: '' });
                    setError('');
                } else if (!formData.checkOut) {
                    if (new Date(dateStr) > new Date(formData.checkIn)) {
                        const conflictDate = hasBookedDateInRange(formData.checkIn, dateStr);
                        if (conflictDate) {
                            setError('Der gewählte Zeitraum enthält bereits einen belegten Tag: ' + conflictDate + '. Bitte wähle einen anderen Zeitraum.');
                            setFormData({ ...formData, checkIn: dateStr, checkOut: '' });
                            return;
                        }
                        setFormData({ ...formData, checkOut: dateStr });
                        setError('');
                    } else {
                        setFormData({ ...formData, checkIn: dateStr, checkOut: '' });
                        setError('');
                    }
                } else {
                    setFormData({ ...formData, checkIn: dateStr, checkOut: '' });
                    setError('');
                }
            };

            const [sending, setSending] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');

                if (!formData.name || !formData.email || !formData.street || !formData.houseNumber || !formData.zip || !formData.city || !formData.checkIn || !formData.checkOut) {
                    setError('Bitte füllen Sie alle erforderlichen Felder aus (inkl. Adresse).');
                    return;
                }
                if (!formData.policyAccepted) {
                    setError('Bitte bestätige, dass du die Stornobedingungen akzeptierst.');
                    return;
                }

                const inquiryTotal = calculateTotal();
                const inquiryNights = calculateNights(formData.checkIn, formData.checkOut);
                const policyAcceptedAt = new Date().toISOString();
                const combinedAddress = `${formData.street} ${formData.houseNumber}, ${formData.zip} ${formData.city}`;

                // Create inquiry (weiterhin lokal speichern, z.B. für das interne Buchungssystem)
                const inquiry = {
                    id: `INQ-${Date.now()}`,
                    ...formData,
                    address: combinedAddress,
                    policyAcceptedAt,
                    total: inquiryTotal,
                    nights: inquiryNights,
                    created: new Date().toLocaleDateString('de-DE'),
                    status: 'new',
                };

                const inquiries = JSON.parse(localStorage.getItem('greenhouse_inquiries') || '[]');
                inquiries.push(inquiry);
                localStorage.setItem('greenhouse_inquiries', JSON.stringify(inquiries));

                // Anfrage direkt an die Datenbank senden (öffentlicher Endpunkt, kein Login nötig)
                fetch(`${API_BASE}/api/inquiries`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: formData.name,
                        email: formData.email,
                        phone: formData.phone,
                        street: formData.street,
                        houseNumber: formData.houseNumber,
                        zip: formData.zip,
                        city: formData.city,
                        address: combinedAddress,
                        wohnung: formData.wohnung,
                        checkIn: formData.checkIn,
                        checkOut: formData.checkOut,
                        persons: formData.persons,
                        earlyCheckin: formData.earlyCheckin,
                        lateCheckout: formData.lateCheckout,
                        finalCleaning: formData.finalCleaning,
                        dogFee: formData.dogFee,
                        dogCount: formData.dogCount,
                        projektSpace: formData.projektSpace,
                        paymentMethod: formData.paymentMethod,
                        total: inquiryTotal,
                        nights: inquiryNights,
                        policyAcceptedAt: policyAcceptedAt,
                    }),
                }).catch((err) => {
                    console.warn('Anfrage konnte nicht an die Datenbank gesendet werden (kommt trotzdem per E-Mail an):', err);
                });

                // Automatischer Mail-Versand per Formspree
                setSending(true);
                const wohnungLabel = formData.wohnung === 'wohnung1' ? 'Wohnung I'
                    : formData.wohnung === 'wohnung2' ? 'Wohnung II'
                    : 'Beide Wohnungen';

                const fd = new FormData();
                fd.append('form-name', 'buchungsanfrage');
                fd.append('name', formData.name);
                fd.append('email', formData.email);
                fd.append('telefon', formData.phone);
                fd.append('strasse', formData.street);
                fd.append('hausnummer', formData.houseNumber);
                fd.append('plz', formData.zip);
                fd.append('ort', formData.city);
                fd.append('adresse', combinedAddress);
                fd.append('wohnung', wohnungLabel);
                fd.append('anreise', formData.checkIn);
                fd.append('abreise', formData.checkOut);
                fd.append('naechte', String(inquiryNights));
                fd.append('gaeste', String(formData.persons));
                fd.append('gesamtpreis', `${inquiryTotal.toFixed(2)}€`);
                fd.append('early_checkin', formData.earlyCheckin ? 'Ja' : 'Nein');
                fd.append('late_checkout', formData.lateCheckout ? 'Ja' : 'Nein');
                fd.append('hundegebuehr', formData.dogFee ? `Ja (${formData.dogCount})` : 'Nein');
                fd.append('projektraum', formData.projektSpace ? 'Ja' : 'Nein');
                fd.append('zahlungsart', formData.paymentMethod);
                fd.append('stornobedingungen_akzeptiert', `Ja, am ${policyAcceptedAt}`);

                fetch('https://formspree.io/f/xzdlgvld', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: fd
                })
                .catch((err) => {
                    console.warn('Formspree-Versand fehlgeschlagen:', err);
                })
                .finally(() => {
                    setSending(false);
                    setSubmitted(true);
                    setTimeout(() => {
                        setSubmitted(false);
                        setFormData({
                            name: '',
                            email: '',
                            phone: '',
                            street: '',
                            houseNumber: '',
                            zip: '',
                            city: '',
                            wohnung: 'wohnung1',
                            checkIn: '',
                            checkOut: '',
                            persons: 1,
                            earlyCheckin: false,
                            lateCheckout: false,
                            finalCleaning: true,
                            dogFee: false,
                            dogCount: 1,
                            projektSpace: false,
                            paymentMethod: 'bank_transfer',
                            policyAccepted: false,
                        });
                    }, 3000);
                });
            };

            const nights = calculateNights(formData.checkIn, formData.checkOut);
            const total = calculateTotal();
            const calendarDays = renderCalendar(currentMonth);

            return (
                <div className="container">
                    <div style={{ marginBottom: '30px' }}>
                        <h1>Buche jetzt</h1>
                        <p style={{ color: 'var(--licht-70)', marginTop: '8px' }}>Finde dein perfektes Wochenende bei uns</p>
                    </div>

                    {submitted && (
                        <div className="success-message">
                            ✓ Danke! Deine Anfrage wurde versendet. Wir melden uns in Kürze bei dir.
                        </div>
                    )}

                    {error && (
                        <div className="error-message">
                            ✗ {error}
                        </div>
                    )}

                    <form onSubmit={handleSubmit}>
                        {/* Kontaktdaten */}
                        <div className="card">
                            <h3 style={{ marginTop: 0 }}>Deine Kontaktdaten</h3>
                            <div className="grid">
                                <div className="form-group">
                                    <label>Name *</label>
                                    <input type="text" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} placeholder="Maria Schmidt" required />
                                </div>
                                <div className="form-group">
                                    <label>E-Mail *</label>
                                    <input type="email" value={formData.email} onChange={(e) => setFormData({ ...formData, email: e.target.value })} placeholder="maria@example.de" required />
                                </div>
                                <div className="form-group">
                                    <label>Telefon</label>
                                    <input type="tel" value={formData.phone} onChange={(e) => setFormData({ ...formData, phone: e.target.value })} placeholder="+49 123 456789" />
                                </div>
                                <div className="form-group" style={{ gridColumn: '1/-1' }}>
                                    <label>Adresse *</label>
                                    <div style={{ display: 'grid', gridTemplateColumns: '3fr 1fr', gap: '10px' }}>
                                        <input type="text" value={formData.street} onChange={(e) => setFormData({ ...formData, street: e.target.value })} placeholder="Straße" required />
                                        <input type="text" value={formData.houseNumber} onChange={(e) => setFormData({ ...formData, houseNumber: e.target.value })} placeholder="Hausnr." required />
                                    </div>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 3fr', gap: '10px', marginTop: '10px' }}>
                                        <input type="text" value={formData.zip} onChange={(e) => setFormData({ ...formData, zip: e.target.value })} placeholder="PLZ" required />
                                        <input type="text" value={formData.city} onChange={(e) => setFormData({ ...formData, city: e.target.value })} placeholder="Ort" required />
                                    </div>
                                    <div style={{ fontSize: '11px', color: 'var(--licht-70)', marginTop: '4px' }}>
                                        Wird für die Rechnung benötigt (gesetzliche Rechnungsangabe).
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Unterkunft & Datum */}
                        <div className="card">
                            <h3 style={{ marginTop: 0 }}>Unterkunft & Datum</h3>
                            <div className="grid">
                                <div className="form-group">
                                    <label>Wohnung *</label>
                                    <select value={formData.wohnung} onChange={(e) => setFormData({ ...formData, wohnung: e.target.value, checkIn: '', checkOut: '' })}>
                                        <option value="wohnung1">Wohnung I</option>
                                        <option value="wohnung2">Wohnung II</option>
                                        <option value="both">Beide Wohnungen</option>
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label>Anzahl Gäste</label>
                                    <input type="number" min="1" max="20" value={formData.persons} onChange={(e) => { const v = parseInt(e.target.value); setFormData({ ...formData, persons: isNaN(v) ? '' : v }); }} onBlur={(e) => { if (!formData.persons) setFormData({ ...formData, persons: 1 }); }} />
                                </div>
                            </div>

                            <div style={{ marginTop: '20px' }}>
                                <label style={{ marginBottom: '12px' }}>Wähle dein Anreise- & Abreisedatum *</label>
                                <div style={{ fontSize: '12px', marginBottom: '8px', color: airbnbSyncStatus === 'ok' ? '#6b9080' : airbnbSyncStatus === 'error' ? '#c86464' : 'var(--licht-70)' }}>
                                    {airbnbSyncStatus === 'loading' && '⏳ Airbnb-Belegung wird geladen…'}
                                    {airbnbSyncStatus === 'ok' && '✓ Airbnb-Belegung live synchronisiert'}
                                    {airbnbSyncStatus === 'error' && '⚠ Airbnb-Belegung konnte nicht geladen werden – nur manuelle Buchungen sichtbar'}
                                </div>
                                <details style={{ fontSize: '11px', color: 'var(--licht-40)', marginBottom: '12px' }}>
                                    <summary style={{ cursor: 'pointer' }}>Debug: Rohdaten anzeigen</summary>
                                    <div style={{ marginTop: '6px' }}>
                                        Airbnb ({formData.wohnung}): {[...(airbnbBooked[formData.wohnung] || [])].sort().join(', ') || '(leer)'}
                                        <br /><br />
                                        Eigene DB ({formData.wohnung}): {[...(ownBooked[formData.wohnung] || [])].sort().join(', ') || '(leer)'}
                                        <br /><br />
                                        Heute (lokal berechnet): {localDateStr(new Date())}
                                    </div>
                                </details>
                                <div className="availability-info">
                                    <div className="availability-item">
                                        <div className="availability-dot available"></div>
                                        <span>Verfügbar</span>
                                    </div>
                                    <div className="availability-item">
                                        <div className="availability-dot booked"></div>
                                        <span>Belegt</span>
                                    </div>
                                </div>
                            </div>

                            <div className="calendar">
                                <div className="calendar-header">
                                    <button type="button" onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))}>← Vorher</button>
                                    <h4>{currentMonth.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}</h4>
                                    <button type="button" onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))}>Später →</button>
                                </div>

                                <div className="calendar-weekdays">
                                    {['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(day => (
                                        <div key={day} className="calendar-weekday">{day}</div>
                                    ))}
                                </div>

                                <div style={{ fontSize: '13px', color: 'var(--licht-70)', marginBottom: '8px' }}>
                                    Aktuell gewählt — Anreise: <strong>{formData.checkIn || '(keine)'}</strong>, Abreise: <strong>{formData.checkOut || '(keine)'}</strong>
                                </div>

                                <div className="calendar-days">
                                    {calendarDays.map((day, idx) => {
                                        if (!day) return <div key={`empty-${idx}`}></div>;
                                        const dateStr = localDateStr(day);
                                        const isBooked = isDateBooked(day);
                                        const isSelected = dateStr === formData.checkIn || dateStr === formData.checkOut;
                                        const inRange = isDateInRange(day);
                                        const isPast = day < new Date() && day.toDateString() !== new Date().toDateString();

                                        const prevDate = new Date(day);
                                        prevDate.setDate(prevDate.getDate() - 1);
                                        const prevStr = localDateStr(prevDate);
                                        const prevBooked = isDateBooked(prevDate);
                                        const edgeSet = blockedEdges[formData.wohnung];
                                        const isEdge = edgeSet && edgeSet.has(dateStr);
                                        const prevIsEdge = edgeSet && edgeSet.has(prevStr);

                                        const isArrival = isBooked && !prevBooked && !prevIsEdge;
                                        const isDeparture = !isBooked && prevBooked;
                                        const isPreBlock = !isBooked && isEdge && !isDeparture;
                                        const halbClass = isArrival ? 'halb-an' : isDeparture ? 'halb-ab' : isPreBlock ? 'halb-vor' : '';

                                        // Selbst wenn ein Tag als "belegt" gilt, weil dort eine ANDERE Buchung
                                        // beginnt (Anreisetag), darf er trotzdem als EIGENES Abreisedatum gewählt
                                        // werden — der eigene Aufenthalt endet dann exklusiv genau an diesem Tag,
                                        // ohne sich mit der neuen Buchung zu überschneiden (Zimmerwechsel am
                                        // selben Tag ist bei uns ausdrücklich erwünscht).
                                        const selectingCheckout = formData.checkIn && !formData.checkOut;
                                        const canSelectAsCheckout = selectingCheckout && isArrival && dateStr > formData.checkIn;
                                        const isClickable = (!isBooked || canSelectAsCheckout || isSelected) && !isPast;

                                        return (
                                            <div
                                                key={dateStr}
                                                className={`calendar-day ${isSelected ? 'selected' : ''} ${inRange ? 'in-range' : ''} ${isBooked ? 'belegt' : ''} ${halbClass} ${isPast ? 'disabled' : ''} ${!isClickable ? 'disabled' : ''}`}
                                                onClick={() => isClickable && handleDateClick(day)}
                                            >
                                                {day.getDate()}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* Zusatzgebühren */}
                        <div className="card">
                            <h3 style={{ marginTop: 0 }}>Zusatzgebühren</h3>

                            <div className="checkbox-group">
                                <input type="checkbox" id="earlyCheckin" checked={formData.earlyCheckin} onChange={(e) => setFormData({ ...formData, earlyCheckin: e.target.checked })} />
                                <label htmlFor="earlyCheckin" style={{ margin: 0 }}>Early Check-in: vor 15:00 Uhr (+{prices.earlyCheckin}€)</label>
                            </div>

                            <div className="checkbox-group">
                                <input type="checkbox" id="lateCheckout" checked={formData.lateCheckout} onChange={(e) => setFormData({ ...formData, lateCheckout: e.target.checked })} />
                                <label htmlFor="lateCheckout" style={{ margin: 0 }}>Late Checkout: nach 11:00 Uhr (+{prices.lateCheckout}€)</label>
                            </div>

                            <div className="checkbox-group">
                                <input type="checkbox" id="finalCleaning" checked={true} disabled={true} /><input type="hidden" value="true" onChange={() => setFormData({ ...formData, finalCleaning: true })} />
                                <label htmlFor="finalCleaning" style={{ margin: 0, opacity: 0.8 }}>Endreinigung (+{getFinalCleaning(formData.wohnung)}€) <em>obligatorisch</em></label>
                            </div>

                            <div className="checkbox-group">
                                <input type="checkbox" id="dogFee" checked={formData.dogFee} onChange={(e) => setFormData({ ...formData, dogFee: e.target.checked })} />
                                <label htmlFor="dogFee" style={{ margin: 0 }}>Ich reise mit Hund/en an ({prices.dogFee}€ pro Hund pro Nacht)</label>
                            </div>

                            {formData.dogFee && (
                                <div style={{ marginLeft: '28px', marginTop: '12px', marginBottom: '12px' }}>
                                    <label>Anzahl Hunde:</label>
                                    <select value={formData.dogCount} onChange={(e) => setFormData({ ...formData, dogCount: parseInt(e.target.value) })}>
                                        {[1, 2, 3, 4, 5].map(n => (
                                            <option key={n} value={n}>{n}</option>
                                        ))}
                                    </select>
                                </div>
                            )}

                            <div className="checkbox-group">
                                <input type="checkbox" id="projektSpace" checked={formData.projektSpace} onChange={(e) => setFormData({ ...formData, projektSpace: e.target.checked })} />
                                <label htmlFor="projektSpace" style={{ margin: 0 }}>Projektraum-Nutzung (+{prices.projektSpace}€/Nacht + {prices.projektSpaceCleaning || 0}€ Reinigung einmalig)</label>
                            </div>
                        </div>

                        {/* Zahlungsmethode */}
                        <div className="card">
                            <h3 style={{ marginTop: 0 }}>Zahlungsmethode</h3>
                            <div className="form-group">
                                <label>Wie möchtest du bezahlen? *</label>
                                <select value={formData.paymentMethod} onChange={(e) => setFormData({ ...formData, paymentMethod: e.target.value })}>
                                    <option value="bank_transfer">Banküberweisung</option>
                                    <option value="paypal">PayPal</option>
                                    <option value="credit_card">Kreditkarte</option>
                                    <option value="klarna">Klarna</option>
                                </select>
                                <div style={{ fontSize: '12px', color: 'var(--licht-70)', marginTop: '8px' }}>
                                    Nach Buchungsbestätigung erhalten Sie einen Zahlungslink per E-Mail.
                                </div>
                            </div>
                        </div>

                        {/* Preisübersicht */}
                        {formData.checkIn && formData.checkOut && (
                            <div className="card">
                                <h3 style={{ marginTop: 0 }}>Preisübersicht</h3>
                                <div className="price-summary">
                                    <div className="price-row">
                                        <span>Zimmerpreis ({nights}×):</span>
                                        <span>
                                            {calculateStayBasePrice(formData.checkIn, formData.checkOut, formData.wohnung).toFixed(2)}€
                                        </span>
                                    </div>

                                    {formData.persons > getBasePersons(formData.wohnung) && (() => {
                                        const rows = [];
                                        const previewBasePersons = getBasePersons(formData.wohnung);
                                        for (let i = previewBasePersons; i < formData.persons; i++) {
                                            const extraPersonIndex = i - previewBasePersons;
                                            const personPrice = getExtraPersonPrice(extraPersonIndex);
                                            rows.push(
                                                <div key={i} className="price-row">
                                                    <span>Person {i + 1} ({nights}×):</span>
                                                    <span>+{(nights * personPrice).toFixed(2)}€</span>
                                                </div>
                                            );
                                        }
                                        return rows;
                                    })()}

                                    {formData.earlyCheckin && <div className="price-row"><span>Early Check-in:</span><span>+{prices.earlyCheckin}€</span></div>}
                                    {formData.lateCheckout && <div className="price-row"><span>Late Checkout:</span><span>+{prices.lateCheckout}€</span></div>}
                                    {formData.finalCleaning && <div className="price-row"><span>Endreinigung:</span><span>+{getFinalCleaning(formData.wohnung)}€</span></div>}
                                    {formData.dogFee && <div className="price-row"><span>Hundegebühr ({formData.dogCount}×{nights}):</span><span>+{(formData.dogCount * nights * prices.dogFee).toFixed(2)}€</span></div>}
                                    {formData.projektSpace && <div className="price-row"><span>Projektraum ({nights}×):</span><span>+{(prices.projektSpace * nights).toFixed(2)}€</span></div>}
                                    {formData.projektSpace && <div className="price-row"><span>Projektraum Reinigung:</span><span>+{prices.projektSpaceCleaning || 0}€</span></div>}

                                    <div className="price-row total">
                                        <span>Gesamtpreis:</span>
                                        <span>{total.toFixed(2)}€</span>
                                    </div>
                                    <div style={{ fontSize: '12px', color: 'var(--licht-70)', marginTop: '12px' }}>
                                        Kaution: 100€ (wird nach Checkout zurückerstattet)
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Stornobedingungen */}
                        <div className="card">
                            <h3 style={{ marginTop: 0 }}>Stornobedingungen</h3>
                            <div style={{
                                fontSize: '12px',
                                color: 'var(--licht-70)',
                                whiteSpace: 'pre-line',
                                maxHeight: '140px',
                                overflowY: 'auto',
                                border: '1px solid rgba(255,255,255,.12)',
                                borderRadius: '4px',
                                padding: '10px 12px',
                                marginBottom: '12px'
                            }}>
                                {liveCancellationPolicy || getStornoText(prices.deposit || 100)}
                            </div>
                            <div className="checkbox-group">
                                <input type="checkbox" id="policyAccepted" checked={formData.policyAccepted} onChange={(e) => setFormData({ ...formData, policyAccepted: e.target.checked })} />
                                <label htmlFor="policyAccepted" style={{ margin: 0 }}>Ich habe die Stornobedingungen gelesen und akzeptiere sie *</label>
                            </div>
                        </div>

                        {/* Button */}
                        <button type="submit" disabled={!formData.checkIn || !formData.checkOut || !formData.policyAccepted || sending}>
                            {sending ? 'Wird gesendet …' : 'Anfrage senden'}
                        </button>
                    </form>

                    <div style={{ marginTop: '40px', padding: '20px', backgroundColor: 'rgba(200, 164, 58, 0.15)', borderRadius: '8px' }}>
                        <h4 style={{ marginTop: 0 }}>ℹ️ Wie es funktioniert:</h4>
                        <ol style={{ margin: '12px 0', paddingLeft: '20px', color: '#ccc', fontSize: '14px' }}>
                            <li>Wähle deine Unterkunft und die Anzahl der Gäste</li>
                            <li>Klicke auf Kalender für An- & Abreise</li>
                            <li>Wähle optionale Zusatzgebühren</li>
                            <li>Überprüfe die Preisübersicht</li>
                            <li>Schicke deine Anfrage ab</li>
                            <li>Wir melden uns innerhalb von 24 Stunden bei dir!</li>
                        </ol>
                    </div>

                    <div style={{ marginTop: '40px', padding: '20px', backgroundColor: 'rgba(107, 144, 128, 0.15)', borderRadius: '8px', borderLeft: '4px solid #6b9080' }}>
                        <h4 style={{ marginTop: 0, marginBottom: '12px' }}>📅 Abonniere unseren Kalender</h4>
                        <p style={{ fontSize: '14px', color: '#ccc', marginBottom: '16px' }}>Importiere den Greenhouse Kalender in dein Kalender-System (Google Calendar, Outlook, Apple Calendar) um immer die aktuelle Verfügbarkeit zu sehen.</p>
                        
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '12px' }}>
                            <a href="https://www.airbnb.de/calendar/ical/50569643.ics?t=55654c77686d4a008d0b3e157bc9fc5e" style={{ 
                                display: 'block',
                                padding: '12px',
                                backgroundColor: 'rgba(107, 144, 128, 0.2)',
                                border: '1px solid #6b9080',
                                borderRadius: '6px',
                                textAlign: 'center',
                                textDecoration: 'none',
                                color: '#6b9080',
                                fontWeight: '500',
                                transition: 'all 0.3s ease',
                                cursor: 'pointer'
                            }} onMouseOver={(e) => { e.target.style.backgroundColor = 'rgba(107, 144, 128, 0.3)'; e.target.style.transform = 'translateY(-2px)'; }} onMouseOut={(e) => { e.target.style.backgroundColor = 'rgba(107, 144, 128, 0.2)'; e.target.style.transform = 'translateY(0)'; }}>
                                📱 Wohnung I
                            </a>
                            <a href="https://www.airbnb.de/calendar/ical/1638991508992594489.ics?t=77ed71be4f204892ab116d8ac12bc2c1" style={{ 
                                display: 'block',
                                padding: '12px',
                                backgroundColor: 'rgba(107, 144, 128, 0.2)',
                                border: '1px solid #6b9080',
                                borderRadius: '6px',
                                textAlign: 'center',
                                textDecoration: 'none',
                                color: '#6b9080',
                                fontWeight: '500',
                                transition: 'all 0.3s ease',
                                cursor: 'pointer'
                            }} onMouseOver={(e) => { e.target.style.backgroundColor = 'rgba(107, 144, 128, 0.3)'; e.target.style.transform = 'translateY(-2px)'; }} onMouseOut={(e) => { e.target.style.backgroundColor = 'rgba(107, 144, 128, 0.2)'; e.target.style.transform = 'translateY(0)'; }}>
                                📱 Wohnung II
                            </a>
                            <a href="https://www.airbnb.de/calendar/ical/1645697917802366310.ics?t=8a02f4a2fb38428d8dcdc2d39612ae43" style={{ 
                                display: 'block',
                                padding: '12px',
                                backgroundColor: 'rgba(107, 144, 128, 0.2)',
                                border: '1px solid #6b9080',
                                borderRadius: '6px',
                                textAlign: 'center',
                                textDecoration: 'none',
                                color: '#6b9080',
                                fontWeight: '500',
                                transition: 'all 0.3s ease',
                                cursor: 'pointer'
                            }} onMouseOver={(e) => { e.target.style.backgroundColor = 'rgba(107, 144, 128, 0.3)'; e.target.style.transform = 'translateY(-2px)'; }} onMouseOut={(e) => { e.target.style.backgroundColor = 'rgba(107, 144, 128, 0.2)'; e.target.style.transform = 'translateY(0)'; }}>
                                📱 Beide Wohnungen
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<BookingForm />);
    </script>
</body>
</html>
